<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Game Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --text:#1e1f24;
  --muted:#6c757d;
  --border:#e6e8ef;
  --primary:#4f46e5;
  --card:#ffffff;
}

@media (prefers-color-scheme: dark){
:root{
  --bg:#0b0d11;
  --text:#e8eaed;
  --muted:#9aa0a6;
  --border:#23262d;
  --primary:#8b9cff;
  --card:#15171c;
}
}

/* ===== BASE ===== */
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui, -apple-system, sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== MAIN WRAPPER ===== */
main{
  width:100%;
}

/* ===== CARD ===== */
.result-card{
  max-width:420px;
  width:90%;
  margin:auto;
  border-radius:20px;
  padding:30px 25px;
  text-align:center;
  background:var(--card);
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

/* ===== TEXT ===== */
.game-name{
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
}

.result-title{
  font-size:28px;
  font-weight:700;
  color:var(--primary);
  margin:10px 0;
}

.score{
  font-size:46px;
  font-weight:800;
  margin:10px 0;
}

.percent{
  font-size:15px;
  color:var(--muted);
}

/* ===== IMAGE ===== */
.result-img{
  height:120px;
  width:120px;
  border-radius:50%;
  margin:20px auto;
  border:3px solid var(--border);
  object-fit:cover;
  box-shadow:0 5px 20px rgba(0,0,0,0.25);
}

/* ===== BUTTON ===== */
.btn-custom{
  border-radius:12px;
  font-weight:600;
  padding:12px;
  font-size:16px;
  transition:.3s;
}

.btn-custom:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(255,193,7,0.4);
}
</style>
</head>

<body>

<main>
  <section class="result-card" aria-labelledby="resultTitle">

    <header>
      <p id="gameName" class="game-name">Game</p>
      <h1 id="resultTitle" class="result-title">Well Played</h1>
    </header>

    <figure>
      <img src="assets/picture/boywithtrophy.webp" alt="Game Result" class="result-img" draggable="false" loading="lazy">
    </figure>

    <article>
      <div id="score" class="score">0 / 0</div>
      <p id="percent" class="percent">0%</p>
    </article>

    <footer>
      <button class="btn btn-warning w-100 btn-custom" onclick="goBack()">
        Back to Home
      </button>
    </footer>

  </section>
</main>

<!-- External Scripts -->
<script src="https://sparrow-tech06.github.io/Figgy/coin/get-coin.js"></script>

<script>
/* ===== DATA ===== */
const score = +localStorage.getItem('lastScore') || 0;
const total = +localStorage.getItem('lastTotal') || 0;
const gameName = localStorage.getItem('lastGame') || 'Game';

const percentValue = total ? Math.round((score/total)*100) : 0;

/* ===== UI UPDATE ===== */
document.getElementById('gameName').innerText = gameName;
document.getElementById('score').innerText = score + ' / ' + total;
document.getElementById('percent').innerText =
  total ? percentValue + '% Accuracy' : 'No Data';

/* ===== SCORE COLOR ===== */
const scoreEl = document.getElementById('score');

if(percentValue >= 80){
  scoreEl.style.color = '#22c55e';
}else if(percentValue >= 50){
  scoreEl.style.color = '#f59e0b';
}else{
  scoreEl.style.color = '#ef4444';
}

/* ===== DYNAMIC MESSAGE ===== */
const title = document.getElementById('resultTitle');

if(percentValue >= 90){
  title.innerText = "🏆 Excellent!";
}else if(percentValue >= 70){
  title.innerText = "🔥 Great Job!";
}else if(percentValue >= 50){
  title.innerText = "👍 Good Try!";
}else{
  title.innerText = "😅 Keep Practicing!";
}

/* ===== SOUND ===== */
if(localStorage.getItem('soundOn') === '1'){
  new Howl({
    src:['assets/sound/correct.mp3'],
    volume:.6
  }).play();
}

/* ===== ONE-TIME REWARD ===== */
(function rewardOnce(){
  const rewardKey = localStorage.getItem('rewardKey');
  if(!rewardKey) return;

  const lock = 'rewarded_' + rewardKey;
  if(localStorage.getItem(lock) === '1') return;

  if(typeof getCoin === 'function'){
    getCoin(10, gameName);
  }

  localStorage.setItem(lock,'1');
})();

/* ===== NAVIGATION ===== */
function goBack(){
  window.history.back();
}

/* Disable exit */
history.pushState(null,'',location.href);
window.onpopstate = () => history.back();
</script>

</body>
</html>
