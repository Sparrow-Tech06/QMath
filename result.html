<!DOCTYPE html>      
<html lang="en">      
<head>      
<meta charset="UTF-8">      
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">      
      
<title> Game Result </title>      
      
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">        
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">      
<script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>      
      
<script src="control_center/version-check.js" defer> </script>      
<link rel="stylesheet" href="global.css">      
        
<style>      
:root{      
  --muted:#6c757d;      
  --border:#ececf3;      
  --primary:#4f46e5;      
  --card:#ffffff;      
  --yellow:#ffc107;
  --bg:#fff;
}      
      
@media (prefers-color-scheme: dark){      
:root{      
  --muted:#9aa0a6;      
  --border:#23262d;      
  --primary:#8b9cff;      
  --card:#15171c;      
  --bg:#0f1115;
}      
}      
      
/* ===== BASE ===== */      
body{      
  margin:0;      
  min-height:100vh;      
  display:flex;      
  align-items:center;      
  justify-content:center;
  background: var(--bg);
  overflow-x:hidden;
}      
      
/* ===== MAIN WRAPPER ===== */      
main{      
  width:100%;
  padding:25px 0;
}      
      
/* ===== CARD ===== */      
.result-card{      
  position:relative;
  overflow:hidden;
  max-width:420px;      
  width:92%;      
  margin:auto;      
  border-radius:34px;      
  padding:35px 24px 24px;      
  text-align:center;      
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:
    0 10px 40px rgba(79,70,229,.10),
    0 2px 10px rgba(0,0,0,.04);
}      

.result-card::before{
  content:'';
  position:absolute;
  width:220px;
  height:220px;
  background:rgba(79,70,229,.08);
  border-radius:50%;
  top:-120px;
  right:-80px;
}

.result-card::after{
  content:'';
  position:absolute;
  width:160px;
  height:160px;
  background:rgba(255,193,7,.12);
  border-radius:50%;
  bottom:-80px;
  left:-60px;
}
      
/* ===== CONFETTI ===== */
.confetti{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.confetti span{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:3px;
  opacity:.8;
  animation:float 4s linear infinite;
}

.confetti span:nth-child(1){
  background:#4f46e5;
  top:10%;
  left:15%;
}

.confetti span:nth-child(2){
  background:#ffc107;
  top:14%;
  right:18%;
}

.confetti span:nth-child(3){
  background:#22c55e;
  top:30%;
  left:8%;
}

.confetti span:nth-child(4){
  background:#ec4899;
  top:36%;
  right:10%;
}

.confetti span:nth-child(5){
  background:#6366f1;
  top:22%;
  left:50%;
}

@keyframes float{
  0%{
    transform:translateY(0) rotate(0deg);
  }
  50%{
    transform:translateY(-10px) rotate(90deg);
  }
  100%{
    transform:translateY(0) rotate(180deg);
  }
}
      
/* ===== TEXT ===== */      
.game-name{      
  font-size:12px;      
  letter-spacing:2px;      
  text-transform:uppercase;      
  color:var(--muted);
  margin-bottom:8px;
  position:relative;
  z-index:2;
}      
      
.result-title{      
  font-size:34px;      
  font-weight:800;      
  color:var(--primary);      
  margin:0;
  position:relative;
  z-index:2;
}      

.subtitle{
  color:var(--muted);
  font-size:15px;
  margin-top:6px;
  position:relative;
  z-index:2;
}
      
/* ===== TROPHY BG ===== */
.trophy-bg{
  position:absolute;
  top:155px;
  left:50%;
  transform:translateX(-50%);
  font-size:180px;
  color:rgba(255,193,7,.10);
  z-index:0;
}
      
/* ===== IMAGE ===== */      
.result-img-wrap{
  position:relative;
  width:max-content;
  margin:30px auto 18px;
  z-index:2;
}

.result-img-ring{
  position:absolute;
  inset:-10px;
  border-radius:50%;
  background:linear-gradient(135deg,#4f46e5,#8b5cf6,#ffc107);
  filter:blur(10px);
  opacity:.35;
}

.result-img{      
  position:relative;
  height:140px;      
  width:140px;      
  border-radius:50%;      
  border:5px solid rgba(255,255,255,.8);      
  object-fit:cover;      
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  background:#fff;
}      
      
/* ===== SCORE BOX ===== */
.score-box{
  position:relative;
  z-index:2;
  background:rgba(255,255,255,.75);
  border:1px solid var(--border);
  border-radius:28px;
  padding:25px 20px;
  margin-top:5px;
  box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.score{      
  font-size:64px;      
  font-weight:900;      
  margin:0;
  line-height:1;
  letter-spacing:-2px;
}      

.score-divider{
  color:#cbd5e1;
  margin:0 5px;
}

.percent-wrap{
  margin-top:18px;
}

.percent-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(135deg,#4f46e5,#6d5dfc);
  color:#fff;
  border-radius:50px;
  padding:10px 18px;
  font-size:15px;
  font-weight:600;
  box-shadow:0 8px 20px rgba(79,70,229,.25);
}

.percent{      
  margin:14px 0 0;
  font-size:15px;      
  color:var(--muted);      
}      

.performance-text{
  margin-top:14px;
  font-size:15px;
  color:var(--muted);
}
      
/* ===== BUTTON ===== */      
.btn-custom{      
  position:relative;
  z-index:2;
  border:none;
  border-radius:18px;      
  font-weight:700;      
  padding:15px;      
  font-size:17px;      
  transition:.3s;
  background:linear-gradient(135deg,#ffc107,#ffb300);
  box-shadow:0 12px 25px rgba(255,193,7,.25);
}      
      
.btn-custom:hover{      
  transform:translateY(-3px);      
  box-shadow:0 16px 35px rgba(255,193,7,.35);      
}

.btn-custom i{
  margin-right:8px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:400px){

.result-title{
  font-size:30px;
}

.score{
  font-size:52px;
}

.result-img{
  width:125px;
  height:125px;
}

.result-card{
  padding:30px 18px 20px;
}

}
</style>      
</head>      
      
<body>      
      
<main>      
  <section class="result-card" aria-labelledby="resultTitle">      

    <div class="confetti">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="trophy-bg">
      <i class="bi bi-trophy-fill"></i>
    </div>
      
    <article>      
      <p id="gameName" class="game-name">Game</p>      
      <h1 id="resultTitle" class="result-title">Well Played</h1>
      <p class="subtitle">You did awesome!</p>
    </article>      
      
    <figure class="result-img-wrap">      
      <div class="result-img-ring"></div>
      <img src="assets/picture/boywithtrophy.webp" alt="Game Result" class="result-img" draggable="false" loading="lazy">      
    </figure>      
      
    <article class="score-box">      
      <div id="score" class="score">0 <span class="score-divider">/</span> 0</div>

      <div class="percent-wrap">
        <div class="percent-badge">
          <i class="bi bi-stars"></i>
          <span id="percentBadge">0% Accuracy</span>
        </div>
      </div>

      <p id="percent" class="percent">0%</p>

      <div class="performance-text" id="performanceText">
        Keep improving your skills every day 🚀
      </div>
    </article>      
      
    <footer class="mt-4">      
      <button class="btn btn-warning w-100 btn-custom" onclick="goBack()">      
        <i class="bi bi-house-fill"></i>
        Back to Home      
      </button>      
    </footer>      
      
  </section>      
</main>      
      
<!-- External Scripts -->      
<script src="https://sparrow-tech06.github.io/QMath/coin/get-coin.js"></script>      
      
<script>      
/* ===== DATA ===== */      
const score = +localStorage.getItem('lastScore') || 0;      
const total = +localStorage.getItem('lastTotal') || 0;      
const gameName = localStorage.getItem('lastGame') || 'Game';      
      
const percentValue = total ? Math.round((score/total)*100) : 0;      
      
/* ===== UI UPDATE ===== */      
document.getElementById('gameName').innerText = gameName;      
document.getElementById('score').innerHTML = score + ' <span class="score-divider">/</span> ' + total;

document.getElementById('percent').innerText =      
  total ? percentValue + '% Accuracy' : 'No Data';

document.getElementById('percentBadge').innerText =
  total ? percentValue + '% Accuracy' : 'No Data';
      
/* ===== SCORE COLOR ===== */      
const scoreEl = document.getElementById('score');      
      
if(percentValue >= 80){      
  scoreEl.style.color = '#22c55e';
}else if(percentValue >= 50){      
  scoreEl.style.color = '#f59e0b';
}else{      
  scoreEl.style.color = '#ef4444';
}      
      
/* ===== DYNAMIC MESSAGE ===== */      
const title = document.getElementById('resultTitle');
const performanceText = document.getElementById('performanceText');
      
if(percentValue >= 90){      
  title.innerText = "Excellent!";
  performanceText.innerText = "Outstanding performance! You're a master 🔥";
}else if(percentValue >= 70){      
  title.innerText = "Great Job!";
  performanceText.innerText = "Awesome work! Keep the streak going 🎉";
}else if(percentValue >= 50){      
  title.innerText = "Good Try!";
  performanceText.innerText = "Nice effort! You’re getting better 💪";
}else{      
  title.innerText = "Keep Practicing!";
  performanceText.innerText = "Practice more and come back stronger 🚀";
}      
      
/* ===== SOUND ===== */      
if(localStorage.getItem('soundOn') === '1'){      
  new Howl({      
    src:['assets/sound/correct.mp3'],      
    volume:.6      
  }).play();      
}      
      
/* ===== ONE-TIME REWARD WITH 50% CONDITION ===== */      
(function rewardOnce(){      
  const rewardKey = localStorage.getItem('rewardKey');      
  if(!rewardKey) return;      
      
  const lock = 'rewarded_' + rewardKey;      
  if(localStorage.getItem(lock) === '1') return;      
      
  const percentValue = total ? Math.round((score/total)*100) : 0;      
      
  // ❌ If less than 50%      
  if(percentValue < 50){      
    const percentEl = document.getElementById('percent');      
    percentEl.innerText = percentValue + '% Accuracy • Minimum 50% required for reward';      
    percentEl.style.color = '#ef4444';      
    return;      
  }      
      
  // ✅ If 50% or more      
  if(typeof getCoin === 'function'){      
    getCoin(10, gameName);      
  }      
      
  localStorage.setItem(lock,'1');      
})();      
      
/* ===== NAVIGATION ===== */      
function goBack(){      
  window.history.back();      
}      
      
/* Disable exit */      
history.pushState(null,'',location.href);      
window.onpopstate = () => history.back();      
</script>      
      
</body>      
</html>
