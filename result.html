<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Game Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>

<script src="control_center/version-check.js" defer></script>
<link rel="stylesheet" href="global.css">

<style>
:root{
  --primary:#4f46e5;
  --muted:#6b7280;
  --green:#22c55e;
  --orange:#f59e0b;
  --red:#ef4444;
  --border:#edf0f5;
  --bg:#ffffff;
}

@media (prefers-color-scheme:dark){
:root{
  --primary:#8b9cff;
  --muted:#9aa0a6;
  --border:#23262d;
  --bg:#0f1115;
}
}

/* ===== BASE ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  -webkit-tap-highlight-color:transparent;
  scroll-behavior:smooth;
}

body{
  background:#fff;
  min-height:100vh;
  font-family:
  system-ui,
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;
  overflow-x:hidden;
  color:#111827;
}

/* ===== MAIN ===== */
main{
  width:100%;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
  30px
  22px
  calc(30px + env(safe-area-inset-bottom));
}

/* ===== CARD ===== */
.result-card{
  width:100%;
  max-width:460px;
  position:relative;
  text-align:center;
}

/* ===== TOP SOFT CIRCLE ===== */
.top-circle{
  position:absolute;
  top:-90px;
  left:50%;
  transform:translateX(-50%);
  width:240px;
  height:240px;
  border-radius:50%;
  background:
  radial-gradient(
    circle,
    rgba(79,70,229,.10) 0%,
    rgba(79,70,229,.03) 55%,
    transparent 75%
  );
  pointer-events:none;
}

/* ===== GAME NAME ===== */
.game-name{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:10px;
  font-weight:600;
}

/* ===== TITLE ===== */
.result-title{
  font-size:40px;
  font-weight:800;
  line-height:1.1;
  color:var(--primary);
  margin-bottom:10px;
}

/* ===== SUBTITLE ===== */
.subtitle{
  font-size:16px;
  color:var(--muted);
  line-height:1.5;
}

/* ===== IMAGE ===== */
.result-img-wrap{
  margin:
  40px
  auto
  28px;
  position:relative;
  width:max-content;
}

.result-img-ring{
  position:absolute;
  inset:-10px;
  border-radius:50%;
  border:2px dashed rgba(79,70,229,.18);
  animation:spin 20s linear infinite;
}

.result-img{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  background:#fff;
  border:5px solid #fff;
}

/* ===== SCORE ===== */
.score-box{
  margin-top:10px;
}

.score{
  font-size:74px;
  font-weight:900;
  line-height:1;
  letter-spacing:-3px;
}

.score-divider{
  color:#d1d5db;
  margin:0 4px;
}

/* ===== BADGE ===== */
.percent-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:22px;
  padding:12px 18px;
  border-radius:100px;
  background:#eef2ff;
  color:var(--primary);
  font-size:15px;
  font-weight:700;
}

/* ===== PERCENT ===== */
.percent{
  margin-top:18px;
  color:var(--muted);
  font-size:16px;
}

/* ===== PERFORMANCE ===== */
.performance-text{
  margin-top:12px;
  color:var(--muted);
  font-size:15px;
  line-height:1.5;
}

/* ===== BUTTON ===== */
footer{
  margin-top:45px;
}

.btn-custom{
  border:none;
  border-radius:18px;
  padding:16px;
  font-size:17px;
  font-weight:700;
  background:#ffc107;
  color:#111827;
  transition:.2s ease;
}

.btn-custom:active{
  transform:scale(.98);
}

.btn-custom i{
  margin-right:8px;
}

/* ===== FLOAT ICONS ===== */
.float-icon{
  position:absolute;
  font-size:18px;
  opacity:.12;
  animation:float 4s ease-in-out infinite;
}

.float-1{
  top:90px;
  left:25px;
  color:#4f46e5;
}

.float-2{
  top:130px;
  right:30px;
  color:#f59e0b;
  animation-delay:.8s;
}

.float-3{
  top:260px;
  left:5px;
  color:#22c55e;
  animation-delay:1.2s;
}

.float-4{
  top:300px;
  right:10px;
  color:#ec4899;
  animation-delay:1.8s;
}

/* ===== ANIMATION ===== */
@keyframes spin{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-8px);
  }
}

/* ===== RESPONSIVE ===== */
@media(max-width:480px){

main{
  padding:
  25px
  20px
  calc(30px + env(safe-area-inset-bottom));
}

.result-title{
  font-size:34px;
}

.score{
  font-size:62px;
}

.result-img{
  width:135px;
  height:135px;
}

.result-img-ring{
  inset:-8px;
}

.percent-badge{
  font-size:14px;
  padding:11px 16px;
}

.btn-custom{
  font-size:16px;
}

}
</style>

</head>

<body>

<main>

  <section class="result-card" aria-labelledby="resultTitle">

    <!-- Soft Background -->
    <div class="top-circle"></div>

    <!-- Floating Icons -->
    <i class="bi bi-stars float-icon float-1"></i>
    <i class="bi bi-trophy-fill float-icon float-2"></i>
    <i class="bi bi-lightning-fill float-icon float-3"></i>
    <i class="bi bi-emoji-smile-fill float-icon float-4"></i>

    <!-- Heading -->
    <article>

      <p id="gameName" class="game-name">
        Game
      </p>

      <h1 id="resultTitle" class="result-title">
        Great Job!
      </h1>

      <p class="subtitle">
        You did awesome today ✨
      </p>

    </article>

    <!-- Image -->
    <figure class="result-img-wrap">

      <div class="result-img-ring"></div>

      <img
      src="assets/picture/boywithtrophy.webp"
      alt="Game Result"
      class="result-img"
      draggable="false"
      loading="lazy">

    </figure>

    <!-- Score -->
    <article class="score-box">

      <div id="score" class="score">
        0
        <span class="score-divider">/</span>
        0
      </div>

      <div class="percent-badge">

        <i class="bi bi-patch-check-fill"></i>

        <span id="percentBadge">
          0% Accuracy
        </span>

      </div>

      <p id="percent" class="percent">
        0%
      </p>

      <div id="performanceText" class="performance-text">
        Keep improving your skills every day 🚀
      </div>

    </article>

    <!-- Button -->
    <footer>

      <button
      class="btn btn-warning w-100 btn-custom"
      onclick="goBack()">

        <i class="bi bi-house-fill"></i>

        Back to Home

      </button>

    </footer>

  </section>

</main>

<!-- External Scripts -->
<script src="https://sparrow-tech06.github.io/QMath/coin/get-coin.js"></script>

<script>
/* ===== DATA ===== */
const score =
+localStorage.getItem('lastScore') || 0;

const total =
+localStorage.getItem('lastTotal') || 0;

const gameName =
localStorage.getItem('lastGame') || 'Game';

const percentValue =
total
? Math.round((score/total)*100)
: 0;

/* ===== UI ===== */
document.getElementById('gameName').innerText =
gameName;

document.getElementById('score').innerHTML =
score +
' <span class="score-divider">/</span> ' +
total;

document.getElementById('percent').innerText =
total
? percentValue + '% Accuracy'
: 'No Data';

document.getElementById('percentBadge').innerText =
total
? percentValue + '% Accuracy'
: 'No Data';

/* ===== SCORE COLOR ===== */
const scoreEl =
document.getElementById('score');

if(percentValue >= 80){

  scoreEl.style.color =
  '#22c55e';

}else if(percentValue >= 50){

  scoreEl.style.color =
  '#f59e0b';

}else{

  scoreEl.style.color =
  '#ef4444';

}

/* ===== TITLE ===== */
const title =
document.getElementById('resultTitle');

const performanceText =
document.getElementById('performanceText');

if(percentValue >= 90){

  title.innerText =
  "Excellent!";

  performanceText.innerText =
  "Outstanding performance! You're amazing 🔥";

}else if(percentValue >= 70){

  title.innerText =
  "Great Job!";

  performanceText.innerText =
  "Awesome work! Keep the streak going 🎉";

}else if(percentValue >= 50){

  title.innerText =
  "Good Try!";

  performanceText.innerText =
  "Nice effort! You're improving 💪";

}else{

  title.innerText =
  "Keep Practicing!";

  performanceText.innerText =
  "Practice more and come back stronger 🚀";

}

/* ===== SOUND ===== */
if(localStorage.getItem('soundOn') === '1'){

  new Howl({
    src:['assets/sound/correct.mp3'],
    volume:.6
  }).play();

}

/* ===== ONE-TIME REWARD ===== */
(function rewardOnce(){

  const rewardKey =
  localStorage.getItem('rewardKey');

  if(!rewardKey) return;

  const lock =
  'rewarded_' + rewardKey;

  if(localStorage.getItem(lock) === '1')
  return;

  const percentValue =
  total
  ? Math.round((score/total)*100)
  : 0;

  /* ❌ BELOW 50% */
  if(percentValue < 50){

    const percentEl =
    document.getElementById('percent');

    percentEl.innerText =
    percentValue +
    '% Accuracy • Minimum 50% required for reward';

    percentEl.style.color =
    '#ef4444';

    return;

  }

  /* ✅ REWARD */
  if(typeof getCoin === 'function'){

    getCoin(10, gameName);

  }

  localStorage.setItem(lock,'1');

})();

/* ===== NAVIGATION ===== */
function goBack(){

  window.history.back();

}

/* ===== DISABLE EXIT ===== */
history.pushState(null,'',location.href);

window.onpopstate = () =>
history.back();
</script>

</body>
</html>
