<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Streak</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--accent:#ff9f1c;
--accent-soft:#fff1dc;
--muted:#6b7280;
}

body{
background:#fff;
font-family:system-ui;
margin:0;
}

.app{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.surface{
max-width:420px;
width:100%;
text-align:center;
}

.streak-box{
width:190px;
height:190px;
border-radius:50%;
background:var(--accent-soft);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
margin:auto;
border:3px solid var(--accent);
margin-bottom:30px;
}

.streak-number{
font-size:64px;
font-weight:800;
color:var(--accent);
}

.streak-label{
font-size:13px;
color:var(--muted);
}

.btn-strike{
width:100%;
height:60px;
border-radius:18px;
font-size:18px;
font-weight:700;
background:var(--accent);
border:none;
}

/* calendar */

.calendar{
margin-top:30px;
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
}

.day{
padding:10px;
border-radius:10px;
font-size:12px;
background:#f3f4f6;
}

.day.active{
background:var(--accent);
color:#000;
font-weight:700;
}

.day.missed{
background:#fde2e2;
color:#b91c1c;
}

.confetti{
position:fixed;
top:-10px;
width:10px;
height:10px;
animation:fall 2.5s linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}

</style>
</head>

<body>

<div class="app">
<div class="surface">

<div class="streak-box">
<div class="streak-number" id="streak">1</div>
<div class="streak-label">DAYS STREAK</div>
</div>

<button class="btn-strike" id="strikeBtn">STRIKE TODAY</button>

<div class="calendar" id="calendar"></div>

</div>
</div>

<script src="https://sparrow-tech06.github.io/QMath/coin/get-coin.js"></script>

<script>

let db;
const todayDate = new Date();
const today = todayDate.toDateString();

const streakEl=document.getElementById("streak");
const btn=document.getElementById("strikeBtn");
const calendar=document.getElementById("calendar");

/* -------------------
OPEN DB
------------------- */

const request=indexedDB.open("StreakDB",1);

request.onupgradeneeded=e=>{
db=e.target.result;
db.createObjectStore("streak",{keyPath:"id"});
};

request.onsuccess=e=>{
db=e.target.result;
loadData();
};


/* -------------------
LOAD DATA
------------------- */

function loadData(){

let tx=db.transaction("streak","readonly");
let store=tx.objectStore("streak");

let req=store.get(1);

req.onsuccess=()=>{

if(req.result){

let data=req.result;

handleMissedDay(data);

streakEl.innerText=data.count;

if(data.lastDate===today){

btn.disabled=true;
btn.innerText="COME BACK TOMORROW";

}

drawCalendar(data.history || []);

}else{

createDefault();

}

};

}


/* -------------------
DEFAULT DATA
------------------- */

function createDefault(){

let tx=db.transaction("streak","readwrite");
let store=tx.objectStore("streak");

store.put({
id:1,
count:1,
lastDate:"",
history:[]
});

}


/* -------------------
MISSED DAY RESET
------------------- */

function handleMissedDay(data){

if(!data.lastDate) return;

let last=new Date(data.lastDate);
let diff=(todayDate-last)/(1000*60*60*24);

if(diff>=2){

data.count=1;
data.history=[];

let tx=db.transaction("streak","readwrite");
let store=tx.objectStore("streak");

store.put(data);

}

}


/* -------------------
CONFETTI
------------------- */

function confetti(){

const colors=["#ff9f1c","#60a5fa","#34d399","#f472b6"];

for(let i=0;i<40;i++){

let el=document.createElement("div");
el.className="confetti";
el.style.left=Math.random()*100+"vw";
el.style.background=colors[Math.floor(Math.random()*colors.length)];

document.body.appendChild(el);

setTimeout(()=>el.remove(),2500);

}

}


/* -------------------
STRIKE BUTTON
------------------- */

btn.onclick=()=>{

let tx=db.transaction("streak","readwrite");
let store=tx.objectStore("streak");

let req=store.get(1);

req.onsuccess=()=>{

let data=req.result;

data.count+=1;
data.lastDate=today;

if(!data.history) data.history=[];
data.history.push(today);

store.put(data);

streakEl.innerText=data.count;

btn.disabled=true;
btn.innerText="COME BACK TOMORROW";

drawCalendar(data.history);

confetti();

getCoin(10,"Daily Streak");

};

};


/* -------------------
CALENDAR UI
------------------- */

function drawCalendar(history){

calendar.innerHTML="";

let days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

for(let i=6;i>=0;i--){

let d=new Date();
d.setDate(todayDate.getDate()-i);

let str=d.toDateString();

let div=document.createElement("div");
div.className="day";

div.innerText=days[d.getDay()];

if(history.includes(str)){

div.classList.add("active");

}else if(d<todayDate){

div.classList.add("missed");

}

calendar.appendChild(div);

}

}

</script>

</body>
</html>
