<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  
<title> Qmath - Daily Math Quiz </title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../global.css">
  
<style>
:root {
  --card: #eef0ff;
  --accent: #7c83fd;
  --accent-soft: #dfe1ff;

  --success: #8fd9a8;
  --danger: #ff9a9a;

  --text: #2b2d42;
  --subtext: #6c757d;

  --question: #ffffff;
  --option-bg: #ffffff;
  --option-border: #e6e8f0;

  --radius: 18px;
}

@media (prefers-color-scheme: dark){
  :root{
    --card: #1e1f2f;
    --question: #2a2c3f;
    --option-bg: #2a2c3f;
    --text: #f1f1f1;
    --subtext: #aaa;
    --option-border: rgba(255,255,255,0.08);
    --accent-soft: rgba(124,131,253,0.15);
  }
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
}

/* Heading */
h1 {
  color: var(--text);
  text-align: center;
  margin: 25px 0;
  font-size: 1.6rem;
  font-weight: 600;
}

/* Layout */
main {
  display: flex;
  justify-content: center;
  padding: 10px;
}

/* Card */
.quiz-card {
  width: 100%;
  max-width: 600px;
  padding: 2rem 1.4rem;
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  text-align: center;
  animation: fadeIn 0.5s ease;
}

/* Question */
.question {
  font-size: 1.3rem;
  padding: 20px;
  border-radius: 14px;
  font-weight: 600;
  margin-bottom: 1.5rem;
  background: var(--question);
  color: var(--text);
  box-shadow: inset 0 0 0 1px var(--option-border);
}

/* Options */
.option-btn {
  width: 100%;
  margin-bottom: 12px;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--option-border);
  background: var(--option-bg);
  color: var(--text);
  transition: all 0.2s ease;
  text-align: left;
  font-weight: 500;
  position: relative;
  padding-left: 48px;
}

/* Label bubble (A B C D) */
.option-btn::before {
  content: attr(data-label);
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--accent-soft);
  color: var(--accent);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
}

/* Hover */
.option-btn:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  transform: translateY(-1px);
}

/* Popup */
.popup {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.15);
  backdrop-filter: blur(8px);
}

.popup-box {
  width: 280px;
  padding: 1.8rem;
  border-radius: 20px;
  background: #ffffff;
  text-align: center;
  animation: scaleUp 0.3s ease;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.correct { color: #4caf88; }
.wrong { color: #ff6b6b; }

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px);}
  to { opacity: 1; transform: translateY(0);}
}

@keyframes scaleUp {
  from { transform: scale(0.85); opacity: 0;}
  to { transform: scale(1); opacity: 1;}
}

/* Confetti stays same */
.confetti-piece {
  position: fixed;
  width: 8px;
  height: 12px;
  top: 0;
  opacity: 0.9;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}
</style>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>

<!-- HEADER -->
<header class="header-section">
  <button class="back-btn" role="button" aria-label="Go back" onclick="window.history.back();">
    <i class="bi bi-arrow-left"></i>
  </button>
</header>

<h1> Today's Question </h1>

<main id="app">
  <section class="quiz-card">

    <div v-if="loading">Loading...</div>

    <div v-else-if="!quiz">
      No quiz today
    </div>

    <div v-else>
      <div class="question">{{ quiz.question }}</div>

      <button
        v-for="(opt,i) in quiz.options"
        :key="i"
        class="option-btn"
        :data-label="labels[i]"
        :disabled="showPopup"
        @click="checkAnswer(opt)"
      >
        {{ opt }}
      </button>
    </div>

  </section>

  <!-- Popup -->
  <div v-if="showPopup" class="popup">
    <div class="popup-box">

      <h2 :class="isCorrect ? 'correct' : 'wrong'">
        {{ isCorrect ? '✔ Correct' : '✖ Wrong' }}
      </h2>

      <p v-if="!isCorrect">
        Answer: {{ quiz.answer }}
      </p>

      <button class="btn btn-dark" @click="closePopup">
        Continue
      </button>

    </div>
  </div>

</main>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      quiz: null,
      loading: true,
      showPopup: false,
      isCorrect: false,
      labels: ["A", "B", "C", "D"]
    }
  },

  methods: {
    async loadQuiz() {
      const res = await fetch('questions.json');
      const data = await res.json();

      const today = new Date().toISOString().split('T')[0];
      this.quiz = data.find(q => q.date === today) || null;

      this.loading = false;
    },

    checkAnswer(selected) {
      this.isCorrect = selected === this.quiz.answer;
      this.showPopup = true;

      if (this.isCorrect) {
        this.launchConfetti();
      }
    },

    closePopup() {
      this.showPopup = false;
    },

    launchConfetti() {
      const colors = ["#ff3b30", "#34c759", "#007aff", "#ffcc00", "#af52de"];

      for (let i = 0; i < 120; i++) {
        const div = document.createElement("div");
        div.classList.add("confetti-piece");

        div.style.left = Math.random() * 100 + "vw";
        div.style.background = colors[Math.floor(Math.random() * colors.length)];
        div.style.animationDuration = (Math.random() * 2 + 2) + "s";

        document.body.appendChild(div);

        setTimeout(() => div.remove(), 4000);
      }
    }
  },

  mounted() {
    this.loadQuiz();
  }

}).mount("#app");
</script>

</body>
</html>
