<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daily Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
:root {
  --bg: #f2f2f7;
  --glass: rgba(255,255,255,0.6);
  --text: #1d1d1f;
  --accent: #007aff;
  --success: #34c759;
  --danger: #ff3b30;
  --radius: 22px;
}

/* Base */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
}

/* Center layout */
main {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Glass card */
.card-ui {
  width: 100%;
  max-width: 380px;
  padding: 28px;
  border-radius: var(--radius);
  background: var(--glass);
  backdrop-filter: blur(25px);
  box-shadow: 
    0 8px 30px rgba(0,0,0,0.08),
    inset 0 1px 1px rgba(255,255,255,0.6);
  text-align: center;
  transition: 0.3s ease;
}

/* Question */
.question {
  font-size: 1.35rem;
  font-weight: 600;
  margin-bottom: 24px;
  color: var(--text);
}

/* Options */
.option {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 10px;
  border: none;
  background: rgba(255,255,255,0.8);
  transition: all 0.2s ease;
}

.option:hover {
  transform: scale(1.02);
  background: var(--accent);
  color: white;
}

/* Popup */
.popup {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.2);
  backdrop-filter: blur(10px);
}

/* Popup box */
.popup-box {
  width: 280px;
  padding: 24px;
  border-radius: 20px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(30px);
  text-align: center;
  animation: spring 0.4s cubic-bezier(.34,1.56,.64,1);
}

@keyframes spring {
  from { transform: scale(0.6); }
  to { transform: scale(1); }
}

.correct { color: var(--success); }
.wrong { color: var(--danger); }

.popup button {
  margin-top: 15px;
  border-radius: 12px;
}

/* Canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<main id="app">
  <section class="card-ui">

    <div v-if="loading">Loading...</div>

    <div v-else-if="!quiz">
      No quiz today
    </div>

    <div v-else>
      <div class="question">{{ quiz.question }}</div>

      <button 
        v-for="(opt,i) in quiz.options"
        :key="i"
        class="option"
        @click="check(opt)"
      >
        {{ opt }}
      </button>
    </div>

  </section>

  <!-- Popup -->
  <div v-if="showPopup" class="popup">
    <div class="popup-box">
      <h3 :class="isCorrect ? 'correct' : 'wrong'">
        {{ isCorrect ? 'Correct' : 'Wrong' }}
      </h3>

      <p v-if="!isCorrect">Answer: {{ quiz.answer }}</p>

      <button class="btn btn-dark" @click="closePopup">
        Continue
      </button>
    </div>
  </div>

</main>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      quiz: null,
      loading: true,
      showPopup: false,
      isCorrect: false,
      confettiPieces: []
    }
  },

  methods: {
    async loadQuiz() {
      const res = await fetch('questions.json');
      const data = await res.json();

      const today = new Date().toISOString().split('T')[0];
      this.quiz = data.find(q => q.date === today) || null;

      this.loading = false;
    },

    check(ans) {
      this.isCorrect = ans === this.quiz.answer;
      this.showPopup = true;

      if (this.isCorrect) this.startConfetti();
    },

    closePopup() {
      this.showPopup = false;
    },

    /* 🎉 Custom Confetti */
    startConfetti() {
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      this.confettiPieces = Array.from({length: 120}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 6 + 2,
        d: Math.random() * 50,
        color: `hsl(${Math.random()*360},100%,50%)`,
        tilt: Math.random() * 10 - 5
      }));

      const draw = () => {
        ctx.clearRect(0,0,canvas.width,canvas.height);

        this.confettiPieces.forEach(p => {
          ctx.beginPath();
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.r, p.r);

          p.y += 3;
          p.x += Math.sin(p.d);

          if (p.y > canvas.height) {
            p.y = -10;
          }
        });

        requestAnimationFrame(draw);
      };

      draw();

      setTimeout(() => {
        ctx.clearRect(0,0,canvas.width,canvas.height);
      }, 2000);
    }
  },

  mounted() {
    this.loadQuiz();
  }
}).mount('#app');
</script>

</body>
</html>
