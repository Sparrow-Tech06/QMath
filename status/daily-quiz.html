<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Math Challenge</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: #f5f7fb;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.app-container {
  max-width: 420px;
  margin: auto;
}

.card-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card-ui {
  background: #ffffff;
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

.title {
  font-size: 1.4rem;
  font-weight: 600;
}

.coin-card {
  font-size: 1.1rem;
  text-align: center;
}

.question {
  font-size: 1.1rem;
  font-weight: 500;
}

.option {
  background: #f1f3f9;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s ease;
}

.option:hover {
  background: #e2e6f3;
}

.option.disabled {
  opacity: 0.6;
  pointer-events: none;
}

.popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
}

.popup-box {
  background: white;
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  width: 90%;
  max-width: 300px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.result-img {
  width: 80px;
}

.ok-btn {
  margin-top: 16px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #4f46e5;
  color: white;
}

.ok-btn:hover {
  background: #4338ca;
}
</style>
</head>

<body>
<main id="app" class="app-container py-4">

  <header class="card-ui text-center">
    <div class="title">Today's Challenge</div>
    <small class="text-muted">{{todayDate}}</small>
  </header>

  <section class="card-stack">

    <article class="card-ui coin-card">
      🪙 {{coins}} Coins
    </article>

    <article v-if="locked" class="card-ui text-center text-success">
      You already completed today's challenge 🎉
    </article>

    <article v-if="quiz && !locked" class="card-ui">
      <div class="question mb-3">{{quiz.question}}</div>

      <div>
        <div
          class="option"
          v-for="opt in quiz.options"
          :class="{disabled:answered}"
          @click="!answered && check(opt)"
        >
          {{opt}}
        </div>
      </div>
    </article>

  </section>

  <div v-if="showPopup" class="popup">
    <div class="popup-box">
      <img :src="popupImage" class="result-img" />

      <h5 v-if="result=='correct'" class="text-success mt-3">
        Correct +10 coins 🎉
      </h5>

      <h5 v-if="result=='wrong'" class="text-danger mt-3">
        Wrong Answer
      </h5>

      <button class="ok-btn" @click="closePopup">
        Continue
      </button>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      quiz: null,
      coins: 0,
      todayDate: "",
      locked: false,
      answered: false,
      showPopup: false,
      result: "",
      popupImage: ""
    };
  },

  async mounted() {
    let today = new Date();
    this.todayDate = today.toDateString();
    let iso = today.toISOString().slice(0, 10);

    let res = await fetch("data/questions.json");
    let data = await res.json();
    this.quiz = data.find(q => q.date === iso);

    this.coins = Number(localStorage.getItem("coins") || 0);

    let played = localStorage.getItem("playedDate");
    if (played === iso) {
      this.locked = true;
    }
  },

  methods: {
    check(opt) {
      this.answered = true;
      let today = new Date().toISOString().slice(0, 10);

      if (opt === this.quiz.answer) {
        this.result = "correct";
        this.popupImage = "assets/correct.png";
        this.coins += 10;
        localStorage.setItem("coins", this.coins);
        localStorage.setItem("playedDate", today);
        this.locked = true;
      } else {
        this.result = "wrong";
        this.popupImage = "assets/wrong.png";
      }

      this.showPopup = true;
    },

    closePopup() {
      this.showPopup = false;
    }
  }
}).mount("#app");
</script>

</body>
</html>
