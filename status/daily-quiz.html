<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daily Math Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root {
  --bg: #e7e5e4;
  --card: #ffffffcc;
  --primary: #111827;
  --accent: #6366f1;
  --success: #16a34a;
  --danger: #dc2626;
  --radius: 18px;
  --transition: 0.25s ease;
}

/* Background like image */
body {
  margin: 0;
  font-family: system-ui;
  background: url('/mnt/data/5d7bb57f-61d3-47de-8b47-8b4e4aca1182.jpg');
  background-size: cover;
  background-position: center;
}

/* overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(3px);
}

/* layout */
main {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* card */
.quiz-card {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  backdrop-filter: blur(10px);
  border-radius: var(--radius);
  padding: 2rem;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  text-align: center;
}

/* question */
.question {
  font-size: 1.4rem;
  font-weight: 600;
  margin-bottom: 1.5rem;
}

/* buttons */
.option-btn {
  width: 100%;
  margin-bottom: 10px;
  border-radius: 12px;
  padding: 12px;
  border: none;
  background: #f1f5f9;
  transition: var(--transition);
}

.option-btn:hover {
  transform: translateY(-2px);
  background: var(--accent);
  color: white;
}

/* popup */
.popup {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(6px);
  z-index: 999;
}

/* popup box */
.popup-box {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  padding: 2rem;
  border-radius: 20px;
  text-align: center;
  width: 280px;
  animation: pop 0.35s ease;
}

@keyframes pop {
  from { transform: scale(0.6); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.popup h2 {
  font-size: 1.6rem;
  margin-bottom: 10px;
}

.correct { color: var(--success); }
.wrong { color: var(--danger); }

/* button */
.popup button {
  margin-top: 1rem;
  border-radius: 10px;
  padding: 8px 20px;
}

</style>
</head>

<body>

<main id="app">
  <section class="quiz-card">

    <div v-if="loading">Loading...</div>

    <div v-else-if="!quiz">
      No quiz today
    </div>

    <div v-else>
      <div class="question">{{ quiz.question }}</div>

      <button 
        v-for="(opt,i) in quiz.options"
        :key="i"
        class="option-btn"
        @click="checkAnswer(opt)"
      >
        {{ opt }}
      </button>
    </div>

  </section>

  <!-- Popup -->
  <div v-if="showPopup" class="popup">
    <div class="popup-box">

      <h2 :class="isCorrect ? 'correct' : 'wrong'">
        {{ isCorrect ? '🎉 Correct!' : '❌ Wrong' }}
      </h2>

      <p v-if="!isCorrect">
        Correct answer: {{ quiz.answer }}
      </p>

      <button class="btn btn-dark" @click="closePopup">
        Continue
      </button>

    </div>
  </div>

</main>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      quiz: null,
      loading: true,
      showPopup: false,
      isCorrect: false
    }
  },
  methods: {
    async loadQuiz() {
      const res = await fetch('questions.json');
      const data = await res.json();

      const today = new Date().toISOString().split('T')[0];
      this.quiz = data.find(q => q.date === today) || null;

      this.loading = false;
    },

    checkAnswer(selected) {
      this.isCorrect = selected === this.quiz.answer;
      this.showPopup = true;

      if (this.isCorrect) {
        this.confettiBlast();
      }
    },

    closePopup() {
      this.showPopup = false;
    },

    confettiBlast() {
      confetti({ particleCount: 150, spread: 70 });
      confetti({ particleCount: 80, spread: 120, origin: { y: 0.6 } });
    }
  },

  mounted() {
    this.loadQuiz();
  }
}).mount('#app');
</script>

</body>
</html>
