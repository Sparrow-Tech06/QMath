<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  
<title>Daily Math Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
<link href="style.css" rel="stylesheet">
<script src="../control_center/version-check.js" defer> </script>
  
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</head>

<body>

<!-- HEADER -->
<header>
  <button class="back-btn" role="button" aria-label="Go back" onclick="window.history.back();">
    <i class="bi bi-arrow-left"></i>
  </button>
  <div class="title">  </div>
</header>

<main id="app">

  <h1 class="color(--text);> Today's Question </h1>

  <section class="quiz-card">

    <div v-if="loading">Loading...</div>

    <div v-else-if="!quiz">
      No quiz today
    </div>

    <div v-else>
      <div class="question" style="color:var(--text);">{{ quiz.question }}</div>

      <button
        v-for="(opt,i) in quiz.options"
        :key="i"
        class="option-btn"
        @click="checkAnswer(opt)"
      >
        {{ opt }}
      </button>
    </div>

  </section>

  <!-- Popup -->
  <div v-if="showPopup" class="popup">
    <div class="popup-box">

      <h2 :class="isCorrect ? 'correct' : 'wrong'">
        {{ isCorrect ? '✔ Correct' : '✖ Wrong' }}
      </h2>

      <p v-if="!isCorrect">
        Answer: {{ quiz.answer }}
      </p>

      <button class="btn btn-dark" @click="closePopup">
        Continue
      </button>

    </div>
  </div>

</main>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      quiz: null,
      loading: true,
      showPopup: false,
      isCorrect: false
    }
  },

  methods: {
    async loadQuiz() {
      const res = await fetch('questions.json');
      const data = await res.json();

      const today = new Date().toISOString().split('T')[0];
      this.quiz = data.find(q => q.date === today) || null;

      this.loading = false;
    },

    checkAnswer(selected) {
      this.isCorrect = selected === this.quiz.answer;
      this.showPopup = true;

      if (this.isCorrect) {
        this.launchConfetti();
      }
    },

    closePopup() {
      this.showPopup = false;
    },

    // 🎉 CUSTOM CONFETTI ENGINE
    launchConfetti() {
      const colors = ["#ff3b30", "#34c759", "#007aff", "#ffcc00", "#af52de"];

      for (let i = 0; i < 120; i++) {
        const div = document.createElement("div");
        div.classList.add("confetti-piece");

        div.style.left = Math.random() * 100 + "vw";
        div.style.background = colors[Math.floor(Math.random() * colors.length)];
        div.style.animationDuration = (Math.random() * 2 + 2) + "s";
        div.style.transform = `rotate(${Math.random()*360}deg)`;

        document.body.appendChild(div);

        setTimeout(() => div.remove(), 4000);
      }
    }
  },

  mounted() {
    this.loadQuiz();
  }

}).mount("#app");
</script>

</body>
</html>
