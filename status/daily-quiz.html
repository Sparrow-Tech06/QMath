<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Math Quiz</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Vue CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --secondary: #22c55e;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --radius: 16px;
      --transition: all 0.3s ease;
    }

    body {
      background: var(--bg);
      font-family: 'Segoe UI', sans-serif;
      color: var(--text);
    }

    header {
      text-align: center;
      padding: 2rem 1rem;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 1rem;
    }

    .quiz-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      transition: var(--transition);
    }

    .quiz-card:hover {
      transform: translateY(-3px);
    }

    .option-btn {
      width: 100%;
      text-align: left;
      margin-bottom: 10px;
      border-radius: 10px;
      transition: var(--transition);
    }

    .option-btn:hover {
      background: var(--primary);
      color: white;
    }

    .fade-enter-active, .fade-leave-active {
      transition: opacity 0.4s ease;
    }

    .fade-enter-from, .fade-leave-to {
      opacity: 0;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      padding: 1rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<header>
  <h1>Daily Math Quiz</h1>
  <p id="date-display"></p>
</header>

<main id="app">
  <section class="quiz-card">

    <transition name="fade" mode="out-in">
      <div v-if="loading" key="loading">
        <p>Loading quiz...</p>
      </div>

      <div v-else-if="!quiz" key="noquiz">
        <p>No quiz available for today.</p>
      </div>

      <div v-else key="quiz">
        <h5 class="mb-3">Question {{ currentIndex + 1 }}</h5>

        <p class="fw-semibold">{{ currentQuestion.question }}</p>

        <div>
          <button 
            v-for="(opt, index) in currentQuestion.options"
            :key="index"
            class="btn btn-outline-dark option-btn"
            @click="selectOption(index)"
          >
            {{ opt }}
          </button>
        </div>

        <div class="mt-3 text-end">
          <button 
            class="btn btn-primary"
            @click="nextQuestion"
            :disabled="currentIndex >= quiz.questions.length - 1"
          >
            Next
          </button>
        </div>
      </div>
    </transition>

  </section>
</main>

<footer>
  <p>© Daily Quiz App</p>
</footer>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      quiz: null,
      loading: true,
      currentIndex: 0,
      selectedAnswers: []
    };
  },
  computed: {
    currentQuestion() {
      return this.quiz?.questions[this.currentIndex];
    }
  },
  methods: {
    async fetchQuiz() {
      try {
        const res = await fetch('quiz.json');
        const data = await res.json();

        const today = new Date().toISOString().split('T')[0];
        this.quiz = data[today] || null;

      } catch (err) {
        console.error("Error loading quiz:", err);
      } finally {
        this.loading = false;
      }
    },
    selectOption(index) {
      this.selectedAnswers[this.currentIndex] = index;
    },
    nextQuestion() {
      if (this.currentIndex < this.quiz.questions.length - 1) {
        this.currentIndex++;
      }
    }
  },
  mounted() {
    this.fetchQuiz();

    const today = new Date();
    document.getElementById('date-display').innerText =
      today.toDateString();
  }
}).mount('#app');
</script>

</body>
</html>
