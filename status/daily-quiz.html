<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Math Quiz</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Vue -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #fff;
      --success: #22c55e;
      --danger: #ef4444;
      --bg: #f1f5f9;
      --card: #FF9F1A ;
      --radius: 16px;
      --transition: 0.3s ease;
    }

    body {
      background: var(--bg);
      font-family: system-ui;
    }

    header {
      text-align: center;
      padding: 2rem 1rem;
    }

    main {
      max-width: 600px;
      margin: auto;
    }

    .quiz-card {
      background: var(--card);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      transition: var(--transition);
    }

    .option-btn {
      width: 100%;
      margin-bottom: 10px;
      border-radius: 10px;
      transition: var(--transition);
    }

    .option-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* Popup */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
      z-index: 999;
    }

    .popup-box {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      text-align: center;
      animation: scaleIn 0.3s ease;
    }

    @keyframes scaleIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .correct { color: var(--success); }
    .wrong { color: var(--danger); }

  </style>
</head>
<body>

<header>
  <h1>Daily Math Quiz</h1>
  <p id="date-display"></p>
</header>

<main id="app">
  <section class="quiz-card">

    <div v-if="loading">Loading...</div>

    <div v-else-if="!quiz">
      No quiz for today
    </div>

    <div v-else>
      <h5>Question</h5>
      <p class="fw-bold">{{ quiz.question }}</p>

      <button
        v-for="(opt, i) in quiz.options"
        :key="i"
        class="btn btn-outline-dark option-btn"
        @click="checkAnswer(opt)"
      >
        {{ opt }}
      </button>
    </div>

  </section>

  <!-- Popup -->
  <div v-if="showPopup" class="popup">
    <div class="popup-box">
      <h3 :class="isCorrect ? 'correct' : 'wrong'">
        {{ isCorrect ? 'Correct 🎉' : 'Wrong ❌' }}
      </h3>
      <button class="btn btn-primary mt-3" @click="closePopup">
        OK
      </button>
    </div>
  </div>

</main>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      quiz: null,
      loading: true,
      showPopup: false,
      isCorrect: false
    }
  },
  methods: {
    async loadQuiz() {
      try {
        const res = await fetch('questions.json');
        const data = await res.json();

        const today = new Date().toISOString().split('T')[0];

        this.quiz = data.find(q => q.date === today) || null;

      } catch (e) {
        console.error(e);
      } finally {
        this.loading = false;
      }
    },
    checkAnswer(selected) {
      this.isCorrect = selected === this.quiz.answer;
      this.showPopup = true;

      if (this.isCorrect) {
        this.fireConfetti();
      }
    },
    closePopup() {
      this.showPopup = false;
    },
    fireConfetti() {
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });
    }
  },
  mounted() {
    this.loadQuiz();

    const today = new Date();
    document.getElementById("date-display").innerText =
      today.toDateString();
  }
}).mount('#app');
</script>

</body>
</html>
