<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sprint Minus Missing Number</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../butterfly.css">
  
</head>

<body>

<div class="game">

  <div class="top">
    <span id="timerBox"></span>
    <span class="progress-text" id="progress">Played: 0 / 10</span>
  </div>

  <div class="card">
    <div class="q" id="question"></div>
    <div id="options"></div>

    <button id="submitBtn"
      class="btn btn-outline-primary w-100 submit"
      onclick="endGame(true)"
      style="display:none">
      Submit & Finish
    </button>
  </div>

</div>

<script src="../menu.js"></script>
  
<script>
/* ===== SETTINGS ===== */
let timerOn = false;
let soundOn = false;

/* ===== SOUNDS ===== */
const click   = new Howl({ src:['../assets/sound/click.mp3'], volume:.5 });
const correct = new Howl({ src:['../assets/sound/correct.mp3'], volume:.6 });
const wrong   = new Howl({ src:['../assets/sound/wrong.mp3'], volume:.6 });

/* ===== STATE ===== */
let time = 30;
let score = 0;
let index = 0;
const total = 10;
let timerRef = null;
let gameEnded = false;

const timerBox = document.getElementById('timerBox');
const progress = document.getElementById('progress');
const submitBtn = document.getElementById('submitBtn');
const question = document.getElementById('question');
const options = document.getElementById('options');


/* ===== GAME START (MENU EVENT) ===== */
function startGame(){

  timerOn = localStorage.getItem('timerOn') === '1';
  soundOn = localStorage.getItem('soundOn') === '1';

  if(timerOn){

    timerBox.innerText = `⏱ ${time}s`;

    timerRef = setInterval(()=>{
      time--;
      timerBox.innerText = `⏱ ${time}s`;

      if(time <= 0) endGame(false);
    },1000);

  }else{
    timerBox.innerText = 'No Timer';
    submitBtn.style.display = 'block';
  }

  nextQuestion();
}


/* ===== QUESTIONS (MISSING NUMBER) ===== */
function nextQuestion(){
  if(gameEnded) return;

  if(index === total){
    endGame(false);
    return;
  }

  index++;
  progress.innerText = `Played: ${index} / ${total}`;

  let a = Math.floor(Math.random()*20) + 5; // bigger number
  let missing = Math.floor(Math.random()*10);
  let result = a - missing;

  question.innerHTML =
    `${a} - <span class="gap-line"></span> = ${result}`;

   options.innerHTML = '';

  const correctPos = Math.floor(Math.random()*4);

  for(let i=0;i<4;i++){

    const val = i === correctPos
      ? missing
      : missing + (Math.random()>0.5?1:-1) *
        (Math.floor(Math.random()*4)+1);

    const shownValue = val < 0 ? missing + 1 : val;

    const div = document.createElement('div');
    div.className = 'opt';
    div.innerText = shownValue;

    div.onclick = ()=>{

      if(gameEnded || div.classList.contains('opt-disabled')) return;

      options.querySelectorAll('.opt')
        .forEach(o=>{
          o.classList.add('opt-disabled');
          o.style.pointerEvents='none';
        });

      if(soundOn) click.play();

      if(shownValue === missing){
        score++;
        if(soundOn) correct.play();
      }else{
        if(soundOn) wrong.play();
      }

      setTimeout(nextQuestion,600);
    };

    options.appendChild(div);
  }
}


/* ===== END GAME ===== */
function endGame(){
  if(gameEnded) return;

  gameEnded = true;
  clearInterval(timerRef);

  let allowReward = timerOn || index === total;

  if(allowReward)
    localStorage.setItem('rewardKey', Date.now());

  localStorage.setItem('lastGame','Math Minus Game');
  localStorage.setItem('lastScore',score);
  localStorage.setItem('lastTotal',total);
  localStorage.setItem('currentGame','puzzle');

  location.replace('../result.html');
}


/* ===== LISTEN MENU START ===== */
document.addEventListener("gameStart", startGame);

</script>

</body>
</html>
