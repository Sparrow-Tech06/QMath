<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Daily Math Challenge</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app" class="container py-4">

<div class="title text-center">

Today's Challenge

</div>

<div class="text-center text-muted">

{{todayDate}}

</div>

<div class="text-center my-3">

<div class="coin-card card-ui">

🪙 {{coins}}

</div>

</div>

<div v-if="locked" class="alert alert-success text-center">

You already completed today's challenge 🎉

</div>

<div v-if="quiz && !locked">

<div class="question card-ui mb-3">

{{quiz.question}}

</div>

<div class="options">

<div
class="option"
v-for="opt in quiz.options"
:class="{disabled:answered}"
@click="!answered && check(opt)"
>

{{opt}}

</div>

</div>

</div>

<div v-if="showPopup" class="popup">

<div class="popup-box">

<img :src="popupImage" class="result-img">

<h5 v-if="result=='correct'" class="text-success mt-3">

Correct +10 coins 🎉

</h5>

<h5 v-if="result=='wrong'" class="text-danger mt-3">

Wrong answer

</h5>

<button class="ok-btn" @click="closePopup">

Continue

</button>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>

<script>
     const {createApp}=Vue;

createApp({

data(){

return{

quiz:null,
coins:0,

todayDate:"",

locked:false,
answered:false,

showPopup:false,
result:"",
popupImage:""

}

},

async mounted(){

let today=new Date();

this.todayDate=today.toDateString();

let iso=today.toISOString().slice(0,10);

/* load json */

let res=await fetch("data/questions.json");

let data=await res.json();

this.quiz=data.find(q=>q.date===iso);

/* coins */

this.coins=Number(localStorage.getItem("coins")||0);

/* check played */

let played=localStorage.getItem("playedDate");

if(played===iso){

this.locked=true;

}

},

methods:{

check(opt){

this.answered=true;

let today=new Date().toISOString().slice(0,10);

if(opt===this.quiz.answer){

this.result="correct";

this.popupImage="assets/correct.png";

this.coins+=10;

localStorage.setItem("coins",this.coins);

localStorage.setItem("playedDate",today);

this.locked=true;

}else{

this.result="wrong";

this.popupImage="assets/wrong.png";

}

this.showPopup=true;

},

closePopup(){

this.showPopup=false;

}

}

}).mount("#app");
</script>

</body>

</html>
