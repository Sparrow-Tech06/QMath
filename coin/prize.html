<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Math Achievements</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--primary:#6C63FF;
--accent:#00A8FF;
--success:#22c55e;
--border:#e5e7eb;
--soft:#6b7280;
}

body{
margin:0;
background:#fff;
font-family:'Inter',sans-serif;
}

header{
display:flex;
align-items:center;
padding:14px 16px;
border-bottom:1px solid var(--border);
gap:10px;
}

.back-btn{
border:none;
background:#f3f4f6;
width:38px;
height:38px;
border-radius:10px;
font-size:18px;
}

.header-title{
font-weight:700;
font-size:17px;
}

.coin{
margin-left:auto;
font-size:14px;
color:var(--soft);
}

main{
padding:16px;
}

.badge-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.badge-card{
background:#fff;
border:1px solid var(--border);
border-radius:16px;
padding:14px;
text-align:center;
cursor:pointer;
transition:.2s;
}

.badge-card:hover{
transform:translateY(-2px);
}

.badge-img{
width:72px;
height:72px;
object-fit:contain;
margin-bottom:8px;
border-radius:12px;
border:2px solid #f1f5f9;
box-shadow:0 6px 12px rgba(0,0,0,0.08);
}

.badge-card.locked .badge-img{
filter:grayscale(100%);
opacity:.5;
}

.badge-title{
font-weight:600;
font-size:14px;
}

.progress{
height:6px;
border-radius:20px;
margin-top:8px;
}

.progress-bar{
background:linear-gradient(90deg,var(--primary),var(--accent));
}

.modal-status{
color:#fff;
padding:10px;
font-weight:600;
text-align:center;
}

.status-unlocked{
background:var(--success);
}

.status-locked{
background:#6b7280;
}

.modal-badge{
width:110px;
display:block;
margin:auto;
border-radius:14px;
border:2px solid #f1f5f9;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.modal-badge.locked{
filter:blur(4px) grayscale(100%);
opacity:.6;
}

</style>
</head>

<body>

<header>

<button class="back-btn" onclick="history.back()">←</button>

<div class="header-title">Achievements</div>

<div class="coin" id="coinDisplay"></div>

</header>


<main>

<div id="badgeContainer" class="badge-grid"></div>

</main>


<!-- Modal -->

<div class="modal fade" id="badgeModal">

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">

<div id="modalStatusBanner" class="modal-status"></div>

<div class="modal-body text-center">

<img id="modalImg" class="modal-badge mb-3">

<h5 id="modalTitle"></h5>

<p id="modalText" class="text-muted small"></p>

<div class="progress">
<div id="modalProgress" class="progress-bar"></div>
</div>

<button class="btn btn-primary w-100 mt-4" data-bs-dismiss="modal">
OK
</button>

</div>

</div>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

const coin = parseInt(localStorage.getItem("myCoins")) || 0;

document.getElementById("coinDisplay").innerText = coin+" Coins";

const badges = [

{name:"Starter Spark",required:100,img:"../assets/badges/Starter Spark.png"},
{name:"Number Rookie",required:200,img:"../assets/badges/Number Rookie.png"},
{name:"Puzzle Solver",required:400,img:"../assets/badges/Puzzle Solver.png"},
{name:"Brain Booster",required:600,img:"../assets/badges/Brain Booster.png"},
{name:"Equation Explorer",required:900,img:"../assets/badges/Equation Explorer.png"},
{name:"Logic Warrior",required:1200,img:"../assets/badges/Logic Warrior.png"},
{name:"Mind Hacker",required:1500,img:"../assets/badges/Mind Hacker.png"},
{name:"Math Strategist",required:1800,img:"../assets/badges/Math Strategist.png"},
{name:"Number Legend",required:2200,img:"../assets/badges/fractions.png"},
{name:"QMath Master",required:2500,img:"../assets/badges/percentage.png"}

];

const container=document.getElementById("badgeContainer");

badges.forEach(badge=>{

const unlocked=coin>=badge.required;

const percent=Math.min((coin/badge.required)*100,100);

const card=document.createElement("div");

card.className="badge-card "+(unlocked?"":"locked");

card.innerHTML=`

<img src="${badge.img}" class="badge-img">

<div class="badge-title">${badge.name}</div>

<div class="progress">
<div class="progress-bar" style="width:${percent}%"></div>
</div>

`;

card.onclick=()=>openModal(badge,unlocked,percent);

container.appendChild(card);

});

function openModal(badge,unlocked,percent){

const banner=document.getElementById("modalStatusBanner");

const img=document.getElementById("modalImg");

img.src=badge.img;

img.classList.toggle("locked",!unlocked);

document.getElementById("modalTitle").innerText=badge.name;

document.getElementById("modalText").innerText=
unlocked
? "You successfully unlocked this achievement."
: `Collect ${badge.required} coins to unlock this badge.`;

document.getElementById("modalProgress").style.width=percent+"%";

if(unlocked){

banner.innerText="🎉 Congratulations";

banner.className="modal-status status-unlocked";

}else{

banner.innerText="🔒 Badge Locked";

banner.className="modal-status status-locked";

}

new bootstrap.Modal(document.getElementById("badgeModal")).show();

}

</script>

</body>
</html>
