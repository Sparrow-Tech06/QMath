<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Wallet</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --header: #fff;
  --card:#f7f8fa;
  --text:#111;
  --muted:#777;
  --border:#eee;
  --backbtnBg: #eaeaea ;
  --backbtnclr: #000 ;
}

/* DARK MODE */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000;
    --header: #212121;
    --card:#212121;
    --text:#fff;
    --muted:#aaa;
    --border:#333;
    --backbtnBg: #000 ;
    --backbtnclr: #fff ;
  }
}
  /*********************************************/
body{
  background:var(--bg);
  color:var(--text);
  font-family: system-ui, -apple-system, sans-serif;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:var(--header);
  padding:12px 15px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--border);
}

.back-btn{
  width:36px;
  height:36px;
  background: var(--backbtnBg);
  color: var(--backbtnclr);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
}

.title{
  font-weight:600;
  font-size:16px;
}

.balance-wrapper{
  position:sticky;
  top:60px;
  z-index:999;
  background:var(--bg);
  padding:10px 15px;
}

.balance-card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
}

.balance-card h2{
  margin:0;
  font-size:28px;
  font-weight:700;
}

.balance-card small{
  color:var(--muted);
}

/* HISTORY */
.history{
  padding:10px 15px 80px;
}

.history-item{
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width: 660px ;
} 

/* DIFFERENT BG LOOP */
.history-item:nth-child(5n+1){ border:1.6px solid #e3f2fd; }
.history-item:nth-child(5n+2){ border:1.6px solid #e8f5e9; }
.history-item:nth-child(5n+3){ border:1.6px solid #fff3e0; }
.history-item:nth-child(5n+4){ border:1.6px solid #f3e5f5; }
.history-item:nth-child(5n+5){ border:1.6px solid #fce4ec; }

@media (prefers-color-scheme: dark){
  .history-item:nth-child(5n+1){ border:1.6px solid #102a43; }
  .history-item:nth-child(5n+2){ border:1.6px solid #1b4332; }
  .history-item:nth-child(5n+3){ border:1.6px solid #3d2c00; }
  .history-item:nth-child(5n+4){ border:1.6px solid #3b1d3f; }
  .history-item:nth-child(5n+5){ border:1.6px solid #4a1c2a; }
}

.left{
  display:flex;
  flex-direction:column;
}

.source{
  font-size:14px;
  font-weight:500;
}

.date{
  font-size:11px;
  color:var(--muted);
}

.amount{
  font-weight:600;
  font-size:15px;
}

.plus{ color:#28a745; }
.minus{ color:#dc3545; }

/* EMPTY STATE */
.empty{
  text-align:center;
  margin-top:80px;
  olor:var(--muted);
}

.empty i{
  font-size:40px;
  margin-bottom:10px;
}

</style>

</head>
<body>

<!-- HEADER -->
<div class="header">
  <a href="index.html" class="back-btn">
    <i class="bi bi-arrow-left"></i>
  </a>
  <div class="title">Wallet</div>
  <div></div>
</div>

<!-- BALANCE -->
<section class="balance-wrapper">
    <div class="balance-card">
      <small>Total Balance</small>
      <h2 id="coinBalance">0</h2>
    </div>
</section>

<!-- HISTORY -->
<div class="history" id="historyList"></div>

<!-- EMPTY -->
<div class="empty d-none" id="emptyState">
  <i class="bi bi-wallet2"></i>
  <div>No transactions yet</div>
</div>

<script>

// LOAD DATA
function loadWallet(){

  let coins = parseInt(localStorage.getItem("myCoins")) || 0;
  document.getElementById("coinBalance").innerText = coins;

  let history = JSON.parse(localStorage.getItem("coinHistory")) || [];
  let container = document.getElementById("historyList");
  let empty = document.getElementById("emptyState");

  container.innerHTML = "";

  if(history.length === 0){
    empty.classList.remove("d-none");
    return;
  }

  empty.classList.add("d-none");

  history.forEach(item => {

    let div = document.createElement("div");
    div.className = "history-item";

    let signClass = item.amount >= 0 ? "plus" : "minus";
    let sign = item.amount >= 0 ? "+" : "";

    div.innerHTML = `
      <div class="left">
        <div class="source">${item.source}</div>
        <div class="date">${item.date}</div>
      </div>
      <div class="amount ${signClass}">
        ${sign}${item.amount}
      </div>
    `;

    container.appendChild(div);
  });

}

// AUTO LOAD
loadWallet();

</script>

</body>
</html>
