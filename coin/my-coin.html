<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>My Coins</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
 --bg:#ffffff;
 --card:#ffffff;
 --border:#e3e6ea;
 --soft:#9aa0aa;
 --coin:#7b6cff;
 --accent:#ffd54f;
}

@media (prefers-color-scheme: dark){
:root{
 --bg:#0f1115;
 --card:#1d2129;
 --border:#2f3750;
 --soft:#9aa0aa;
 --coin:#9b8cff;
}
}

body{
 background:var(--bg);
 margin:0; padding: 0; user-select: none ;
 font-family:'Inter',sans-serif;
}

.page{
 min-height:100vh;
 display:flex;
 flex-direction:column;
}

/* HEADER */

header{
 background:var(--card);
 padding:18px 16px 14px;
 border-bottom-left-radius:22px;
 border-bottom-right-radius:22px;
 border-bottom:1px solid var(--border);
 position:sticky;
 top:0;
 z-index:10;
}

.back-btn{
 position:absolute;
 left:14px;
 top:14px;
 background:#f2f4f8;
 border-radius:50%;
 font-size:20px;
 padding:7px 11px;
 border:1px solid var(--border);
}

.prize-box{
 position:absolute;
 right:14px;
 top:14px;
 background:#fff0f0;
 border-radius:50%;
 font-size:20px;
 padding:7px 11px;
 border:1px solid var(--border);
 color:#ff4d4f;
}

/* COIN CARD */

.coins{
 margin-top:20px;
 text-align:center;
 padding:18px;
 border-radius:16px;

 background:linear-gradient(135deg,#5f6dff,#9b8cff);
 color:white;

 box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.coin-icon{
 font-size:28px;
}

.coin-count{
 font-size:42px;
 font-weight:700;
}

.coin-label{
 font-size:12px;
 letter-spacing:2px;
 opacity:.9;
}

/* MAIN */

main{
 flex:1;
 padding:14px;
}

/* HISTORY */

.history-item{
 background:var(--card);
 border-radius:12px;
 padding:12px 14px;
 margin-bottom:10px;
 border:1px solid var(--border);
 display:flex;
 align-items:center;
 gap:12px;
 transition:.2s;
}

.history-item:active{
 transform:scale(.98);
}

/* ICON */

.history-icon{
 width:36px;
 height:36px;
 border-radius:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:16px;
 color:white;
}

/* COLORFUL nth-child */

.history-item:nth-child(5n+1) .history-icon{
 background:#ff6b6b;
}

.history-item:nth-child(5n+2) .history-icon{
 background:#4dabf7;
}

.history-item:nth-child(5n+3) .history-icon{
 background:#51cf66;
}

.history-item:nth-child(5n+4) .history-icon{
 background:#f59f00;
}

.history-item:nth-child(5n+5) .history-icon{
 background:#845ef7;
}

/* TEXT */

.history-info{
 flex:1;
}

.history-info strong{
 font-size:15px;
}

.history-info small{
 color:var(--soft);
 font-size:11px;
}

/* SKELETON */

.skeleton{
 height:60px;
 border-radius:12px;
 margin-bottom:10px;
 background:linear-gradient(90deg,#e6e8eb 25%,#f2f3f5 37%,#e6e8eb 63%);
 background-size:400% 100%;
 animation:skeleton 1.2s infinite;
}

@keyframes skeleton{
0%{background-position:100% 0}
100%{background-position:0 0}
}

.empty{
 text-align:center;
 color:var(--soft);
 font-size:13px;
 margin-top:40px;
}

</style>
</head>

<body>

<div class="page">

<header>

<button class="back-btn" onclick="window.history.back()">
<i class="bi bi-arrow-left"></i>
</button>

<a href="prize.html" class="prize-box">
<i class="bi bi-gift-fill"></i>
</a>

<div class="coins">

<i class="bi bi-coin coin-icon"></i>

<div class="coin-count" id="coinCount">0</div>

<div class="coin-label">MY COINS</div>

</div>

</header>

<main id="history">

<div class="skeleton"></div>
<div class="skeleton"></div>
<div class="skeleton"></div>

</main>

</div>

<script>

const coinCountEl = document.getElementById("coinCount");
const historyBox = document.getElementById("history");

coinCountEl.innerText = localStorage.getItem("myCoins") || 0;

setTimeout(()=>{

const historyData = JSON.parse(localStorage.getItem("coinHistory")) || [];

historyBox.innerHTML="";

if(historyData.length===0){
historyBox.innerHTML=`<div class="empty">No coin history available</div>`;
return;
}

/* NEWEST FIRST */

for(let i = historyData.length-1;i>=0;i--){

const item = historyData[i];

const div=document.createElement("div");

div.className="history-item";

div.innerHTML=`

<div class="history-icon">
<i class="bi bi-plus-lg"></i>
</div>

<div class="history-info">
<strong>+${item.amount} Coins</strong><br>
<small>${item.source} • ${item.date}</small>
</div>

`;

historyBox.appendChild(div);

}

},600);

</script>

</body>
</html>
