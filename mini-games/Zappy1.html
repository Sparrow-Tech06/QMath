<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Logic - Premium</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --bg-dark: #0f172a;
            --accent-gold: #fbbf24;
        }

        body {
            background: radial-gradient(circle at top, #1e293b, var(--bg-dark));
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        #app { width: 100%; max-width: 480px; padding: 20px; }

        /* Modern Slim Cards */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        /* Level Grid */
        .level-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .level-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }

        .level-item:active { transform: scale(0.92); }
        .level-item.locked { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }

        .star-rating { color: var(--accent-gold); font-size: 0.7rem; margin-top: 4px; }

        /* Game Elements */
        .target-box { font-size: 0.9rem; color: #94a3b8; }
        .amount-display { font-size: 3.5rem; font-weight: 800; color: #fff; margin: 15px 0; }

        .coin-btn {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #451a03;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 4px 0 #92400e;
            cursor: pointer;
            transition: 0.1s;
            user-select: none;
        }

        .coin-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #92400e; }

        /* Modern Popup Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .popup-modal {
            background: #1e293b;
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            width: 100%;
            max-width: 340px;
            padding: 30px;
            text-align: center;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp { from { opacity:0; transform: translateY(40px); } to { opacity:1; transform: translateY(0); } }

        .progress { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
        .btn-modern { border-radius: 12px; padding: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Skeleton Animation */
        .skeleton { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    </style>
</head>
<body>

<div id="app">
    <main v-if="screen==='home'">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="m-0 fw-bold">🪙 Coin Logic</h4>
            <div class="badge bg-warning text-dark rounded-pill px-3">Pro</div>
        </div>

        <div class="level-grid">
            <template v-if="!levels.length">
                <div v-for="i in 9" class="level-item skeleton"></div>
            </template>
            
            <div v-for="(l, i) in levels" :key="l.id" 
                 class="level-item" :class="{ locked: !isUnlocked(l, i) }"
                 @click="startLevel(l, i)">
                <span class="fw-bold">Lvl {{l.id}}</span>
                <div class="star-rating">
                    <i v-for="s in 3" :class="s <= (progress[l.id] || 0) ? 'bi bi-star-fill' : 'bi bi-star'"></i>
                </div>
                <i v-if="!isUnlocked(l, i)" class="bi bi-lock-fill position-absolute top-0 end-0 m-2 opacity-50"></i>
            </div>
        </div>
    </main>

    <main v-if="screen==='game'" class="game-container">
        <div class="glass-card mb-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <button @click="screen='home'" class="btn btn-sm btn-outline-light border-0"><i class="bi bi-chevron-left"></i> Exit</button>
                <div class="fw-bold text-warning">Moves: {{current.movesLeft}}</div>
            </div>

            <div class="text-center">
                <div class="target-box">TARGET ₹{{current.target}}</div>
                <h1 class="amount-display">₹{{current.amount}}</h1>
                
                <div class="progress mb-4">
                    <div class="progress-bar bg-warning" :style="{ width: progressPercent + '%' }"></div>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-3 py-3">
                <div v-for="coin in current.coins" :key="coin" 
                     class="coin-btn" @click="tapCoin(coin)">+{{coin}}</div>
            </div>
        </div>
    </main>

    <div v-if="popup" class="overlay">
        <div class="popup-modal">
            <template v-if="popup.type==='success'">
                <div class="mb-3"><i class="bi bi-check-circle-fill text-success display-1"></i></div>
                <h2 class="fw-bold">Excellent!</h2>
                <div class="star-rating fs-4 mb-4">
                    <i v-for="s in 3" :class="s <= popup.stars ? 'bi bi-star-fill' : 'bi bi-star'"></i>
                </div>
                <button class="btn btn-success w-100 btn-modern mb-2" @click="nextLevel">Next Level</button>
            </template>

            <template v-else>
                <div class="mb-3"><i class="bi bi-x-circle-fill text-danger display-1"></i></div>
                <h2 class="fw-bold">Game Over</h2>
                <p class="text-muted">Target was ₹{{current.target}}</p>
                <button class="btn btn-warning w-100 btn-modern mb-2" @click="retry">Try Again</button>
            </template>
            <button class="btn btn-outline-secondary w-100 btn-modern border-0" @click="popup=null;screen='home'">Main Menu</button>
        </div>
    </div>
</div>

<script>
const { createApp } = Vue;

const sounds = {
    success: new Howl({ src: ["https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"], volume: 0.5 }),
    fail: new Howl({ src: ["https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"], volume: 0.5 })
};

createApp({
    data() {
        return {
            levels: [],
            screen: "home",
            current: null,
            popup: null,
            progress: JSON.parse(localStorage.getItem("coin_logic_prog") || "{}")
        }
    },
    mounted() {
        fetch("math.json?v=" + Date.now())
            .then(r => r.json())
            .then(d => this.levels = d.levels)
            .catch(e => console.error("JSON Error:", e));
    },
    methods: {
        isUnlocked(l, i) {
            return i === 0 || this.progress[this.levels[i - 1].id];
        },
        startLevel(l, i) {
            if (!this.isUnlocked(l, i)) return;
            this.current = { ...l, amount: 0, movesLeft: l.moves };
            this.popup = null;
            this.screen = "game";
        },
        tapCoin(v) {
            if (this.popup || this.current.movesLeft <= 0) return;
            
            this.current.amount += v;
            this.current.movesLeft--;

            if (this.current.amount === this.current.target) {
                sounds.success.play();
                const stars = this.current.movesLeft >= 2 ? 3 : this.current.movesLeft === 1 ? 2 : 1;
                this.progress[this.current.id] = Math.max(this.progress[this.current.id] || 0, stars);
                localStorage.setItem("coin_logic_prog", JSON.stringify(this.progress));
                this.popup = { type: "success", stars };
            } else if (this.current.movesLeft === 0 || this.current.amount > this.current.target) {
                sounds.fail.play();
                this.popup = { type: "fail" };
            }
        },
        retry() {
            const idx = this.levels.findIndex(l => l.id === this.current.id);
            this.startLevel(this.levels[idx], idx);
        },
        nextLevel() {
            const i = this.levels.findIndex(l => l.id === this.current.id);
            const n = this.levels[i + 1];
            this.popup = null;
            n ? this.startLevel(n, i + 1) : this.screen = "home";
        }
    },
    computed: {
        progressPercent() {
            return (this.current.amount / this.current.target) * 100;
        }
    }
}).mount("#app");
</script>
</body>
</html>
