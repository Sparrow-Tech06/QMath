<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Logic - Final Fix</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --qmath-blue: #94C1D9;
            --accent-yellow: #FFD700;
            --locked-grey: #E0E0E0;
            --text-dark: #000000;
            --text-muted: #888888;
        }

        body { margin: 0; font-family: sans-serif; display: flex; justify-content: center; background: #fff; }
        #app { width: 100%; max-width: 420px; padding: 20px; text-align: center; }

        /* Level Grid Improvements */
        .level-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .lvl-box {
            border: 2px solid var(--text-dark);
            border-radius: 12px;
            padding: 15px 5px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            background: #fff;
            color: var(--text-dark);
            transition: 0.2s;
        }

        /* Lock/Unlock Visuals */
        .lvl-box.locked {
            border-color: var(--locked-grey);
            color: var(--text-muted);
            background: #fafafa;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Game UI */
        .game-header { display: flex; justify-content: space-between; margin-bottom: 25px; }
        .info-box { border: 2px solid #000; border-radius: 10px; padding: 8px 15px; font-weight: bold; background: #f0f0f0; }

        .main-card {
            background: var(--qmath-blue);
            border: 2px solid #000;
            border-radius: 25px;
            padding: 35px 20px;
            margin-bottom: 30px;
            box-shadow: 0 6px 0 #000;
        }

        .target-label {
            background: #fff;
            border: 2px solid #000;
            border-radius: 12px;
            padding: 10px 20px;
            display: inline-block;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* Progress Bar Fix */
        .progress-container {
            height: 12px;
            background: rgba(255,255,255,0.4);
            border: 2px solid #000;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-yellow);
            transition: width 0.3s ease;
        }

        .amount-display { font-size: 3.5rem; font-weight: 900; border-bottom: 4px solid #000; display: inline-block; min-width: 100px; }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #000;
            border-radius: 15px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
        }

        .option-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }

        .reset-btn {
            background: var(--accent-yellow);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #000;
            cursor: pointer;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 4px 0 #000;
        }

        /* Popup */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .popup {
            background: #fff;
            border: 3px solid #000;
            padding: 30px;
            border-radius: 25px;
            width: 80%;
            max-width: 320px;
        }
        .btn-pop {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 2px solid #000;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="app">
    <div v-if="screen==='home'">
        <h2 style="font-weight: 900;">COIN LOGIC</h2>
        <p style="color: #666;">Choose a challenge</p>
        <div class="level-list">
            <div v-for="(l, i) in levels" :key="l.id" 
                 class="lvl-box" :class="{locked: !isUnlocked(l,i)}"
                 @click="startLevel(l,i)">
                {{l.id}}
            </div>
        </div>
    </div>

    <div v-if="screen==='game'">
        <div class="game-header">
            <div class="info-box" @click="screen='home'">Level {{current.id}}</div>
            <div class="info-box">Moves {{current.movesLeft}}</div>
        </div>

        <div class="main-card">
            <div class="target-label">Target {{current.target}}</div>
            
            <div class="progress-container">
                <div class="progress-bar" :style="{width: progressPercent + '%'}"></div>
            </div>

            <div class="amount-display">₹{{current.amount}}</div>
        </div>

        <div class="btn-grid">
            <div v-for="c in current.coins" :key="c" 
                 class="option-btn" @click="tapCoin(c)">
                +{{c}}
            </div>
        </div>

        <button class="reset-btn" @click="retry">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </div>

    <div v-if="popup" class="overlay">
        <div class="popup">
            <h2 v-if="popup.type==='success'">🎉 Level Clear!</h2>
            <h2 v-else>❌ Failed!</h2>
            <p v-if="popup.type==='fail'">Target was ₹{{current.target}}</p>
            
            <button v-if="popup.type==='success'" class="btn-pop" style="background: var(--accent-yellow);" @click="nextLevel">Next Level</button>
            <button v-else class="btn-pop" style="background: var(--accent-yellow);" @click="retry">Try Again</button>
            <button class="btn-pop" @click="popup=null;screen='home'">Main Menu</button>
        </div>
    </div>
</div>

<script>
const { createApp } = Vue;

const sounds = {
    success: new Howl({ src: ["https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"] }),
    fail: new Howl({ src: ["https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"] })
};

createApp({
    data() {
        return {
            levels: [],
            screen: "home",
            current: null,
            popup: null,
            progress: JSON.parse(localStorage.getItem("coin_logic_save") || "{}")
        }
    },
    mounted() {
        fetch("math.json?v="+Date.now())
            .then(r => r.json())
            .then(d => this.levels = d.levels);
    },
    methods: {
        isUnlocked(l, i) {
            return i === 0 || this.progress[this.levels[i - 1].id];
        },
        startLevel(l, i) {
            if (!this.isUnlocked(l, i)) return;
            this.current = { ...l, amount: 0, movesLeft: l.moves };
            this.popup = null;
            this.screen = "game";
        },
        tapCoin(v) {
            if (this.popup || this.current.movesLeft <= 0) return;
            
            this.current.amount += v;
            this.current.movesLeft--;

            if (this.current.amount === this.current.target) {
                sounds.success.play();
                this.progress[this.current.id] = true;
                localStorage.setItem("coin_logic_save", JSON.stringify(this.progress));
                this.popup = { type: "success" };
            } else if (this.current.movesLeft === 0 || this.current.amount > this.current.target) {
                sounds.fail.play();
                this.popup = { type: "fail" };
            }
        },
        retry() {
            this.popup = null;
            const idx = this.levels.findIndex(l => l.id === this.current.id);
            this.startLevel(this.levels[idx], idx);
        },
        nextLevel() {
            this.popup = null;
            const i = this.levels.findIndex(l => l.id === this.current.id);
            const n = this.levels[i + 1];
            if (n) {
                this.startLevel(n, i + 1);
            } else {
                this.screen = "home";
            }
        }
    },
    computed: {
        progressPercent() {
            if (!this.current) return 0;
            let p = (this.current.amount / this.current.target) * 100;
            return Math.min(p, 100); // 100 se upar na jaye
        }
    }
}).mount("#app");
</script>
</body>
</html>
