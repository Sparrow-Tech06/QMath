<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Logic - QMath Edition</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary-bg: #FFFFFF;
            --card-grey: #F1F3F4;
            --accent-yellow: #FFD700;
            --qmath-blue: #94C1D9;
            --qmath-green: #29A745;
            --qmath-red: #DC3545;
            --text-main: #202124;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--primary-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        #app { width: 100%; max-width: 420px; padding: 25px; text-align: center; }

        /* Header Style */
        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .info-box {
            background: var(--card-grey);
            border: 2px solid var(--text-main);
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* Main Game Card */
        .main-card {
            background: var(--qmath-blue); /* Professional QMath Blue */
            border: 2px solid var(--text-main);
            border-radius: 28px;
            padding: 45px 25px;
            margin-bottom: 35px;
            box-shadow: 0 8px 0 var(--text-main);
        }

        .target-label {
            background: var(--card-grey);
            border: 2px solid var(--text-main);
            border-radius: 15px;
            padding: 12px 25px;
            display: inline-block;
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 35px;
        }

        .yellow-line {
            height: 8px;
            background: var(--accent-yellow);
            width: 100%;
            border-radius: 10px;
            border: 2px solid var(--text-main);
            margin-bottom: 35px;
        }

        .amount-display {
            font-size: 4rem;
            font-weight: 900;
            color: var(--text-main);
            text-decoration: underline;
            text-underline-offset: 10px;
        }

        /* Option Buttons Grid */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .option-btn {
            background: var(--card-grey);
            border: 2px solid var(--text-main);
            border-radius: 18px;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--text-main);
            transition: all 0.1s;
        }

        .option-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--text-main);
        }

        /* Reset Button */
        .reset-btn {
            background: var(--accent-yellow);
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 2px solid var(--text-main);
            cursor: pointer;
            font-size: 2.8rem;
            box-shadow: 0 6px 0 var(--text-main);
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--text-main);
        }

        /* Modern Modern Popup */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .popup {
            background: white;
            border: 3px solid var(--text-main);
            padding: 40px 30px;
            border-radius: 32px;
            width: 85%;
            max-width: 340px;
            box-shadow: 0 15px 0 rgba(0,0,0,0.2);
            animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup h2 { font-weight: 900; font-size: 2rem; margin-bottom: 10px; }
        .popup p { color: #666; margin-bottom: 25px; font-weight: 600; }

        .btn-action {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: 2px solid var(--text-main);
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-next { background: var(--qmath-green); color: white; box-shadow: 0 4px 0 #1e7e34; }
        .btn-retry { background: var(--accent-yellow); color: var(--text-main); box-shadow: 0 4px 0 #ccac00; }
        .btn-home { background: var(--card-grey); color: var(--text-main); box-shadow: 0 4px 0 #ccc; }

        /* Levels list */
        .level-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .lvl-box {
            background: var(--card-grey);
            border: 2px solid var(--text-main);
            padding: 15px 5px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .lvl-box.locked { background: #eee; opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="app">
    <div v-if="screen==='home'">
        <h2 style="font-weight: 900;">COIN LOGIC</h2>
        <p style="color: #666; font-weight: 600;">Choose a challenge</p>
        <div class="level-list">
            <div v-for="(l, i) in levels" :key="l.id" 
                 class="lvl-box" :class="{locked: !isUnlocked(l,i)}"
                 @click="startLevel(l,i)">
                {{l.id}}
            </div>
        </div>
    </div>

    <div v-if="screen==='game'">
        <div class="game-header">
            <div class="info-box" @click="screen='home'">LVL {{current.id}}</div>
            <div class="info-box" :style="{color: current.movesLeft <= 1 ? 'var(--qmath-red)' : ''}">
                MOVES {{current.movesLeft}}
            </div>
        </div>

        <div class="main-card">
            <div class="target-label">Target {{current.target}}</div>
            <div class="yellow-line"></div>
            <div class="amount-display">₹{{current.amount}}</div>
        </div>

        <div class="btn-grid">
            <div v-for="c in current.coins" :key="c" 
                 class="option-btn" @click="tapCoin(c)">
                +{{c}}
            </div>
        </div>

        <button class="reset-btn" @click="retry">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </div>

    <div v-if="popup" class="overlay">
        <div class="popup">
            <template v-if="popup.type==='success'">
                <div style="font-size: 4rem;">🎉</div>
                <h2>Level Up!</h2>
                <p>Perfectly calculated!</p>
                <button class="btn-action btn-next" @click="nextLevel">NEXT LEVEL</button>
            </template>

            <template v-else>
                <div style="font-size: 4rem;">❌</div>
                <h2>Try Again</h2>
                <p>You missed the target.</p>
                <button class="btn-action btn-retry" @click="retry">RETRY</button>
            </template>
            
            <button class="btn-action btn-home" @click="popup=null;screen='home'">BACK TO MENU</button>
        </div>
    </div>
</div>

<script>
const { createApp } = Vue;

const sounds = {
    success: new Howl({ src: ["https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"] }),
    fail: new Howl({ src: ["https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"] })
};

createApp({
    data() {
        return {
            levels: [],
            screen: "home",
            current: null,
            popup: null,
            progress: JSON.parse(localStorage.getItem("coin_prog_qmath") || "{}")
        }
    },
    mounted() {
        fetch("math.json?v="+Date.now())
            .then(r => r.json())
            .then(d => this.levels = d.levels);
    },
    methods: {
        isUnlocked(l, i) {
            return i === 0 || this.progress[this.levels[i - 1].id];
        },
        startLevel(l, i) {
            if (!this.isUnlocked(l, i)) return;
            this.current = { ...l, amount: 0, movesLeft: l.moves };
            this.popup = null;
            this.screen = "game";
        },
        tapCoin(v) {
            if (this.popup || this.current.movesLeft <= 0) return;
            this.current.amount += v;
            this.current.movesLeft--;

            if (this.current.amount === this.current.target) {
                sounds.success.play();
                this.progress[this.current.id] = true;
                localStorage.setItem("coin_prog_qmath", JSON.stringify(this.progress));
                this.popup = { type: "success" };
            } else if (this.current.movesLeft === 0 || this.current.amount > this.current.target) {
                sounds.fail.play();
                this.popup = { type: "fail" };
            }
        },
        retry() {
            const idx = this.levels.findIndex(l => l.id === this.current.id);
            this.startLevel(this.levels[idx], idx);
        },
        nextLevel() {
            const i = this.levels.findIndex(l => l.id === this.current.id);
            const n = this.levels[i + 1];
            n ? this.startLevel(n, i + 1) : this.screen = "home";
            this.popup = null;
        }
    }
}).mount("#app");
</script>
</body>
</html>
