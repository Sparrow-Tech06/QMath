<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coin Logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

<style>
:root{
  --primary:#6c8cff;
  --bg:linear-gradient(160deg,#f4f7ff,#ffffff);
}

*{user-select:none;}

body{
  background:var(--bg);
  min-height:100vh;
}

.app{
  max-width:420px;
  margin:auto;
  padding:16px;
}

/* LEVELS */
.level-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}
.level{
  background:linear-gradient(135deg,#6c8cff,#8fa6ff);
  color:#fff;
  aspect-ratio:1;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  box-shadow:0 12px 26px rgba(108,140,255,.45);
  transition:.25s;
}
.level:hover{transform:translateY(-5px) scale(1.03);}
.level.locked{
  background:#e5e9ff;
  color:#9aa6d8;
  box-shadow:none;
}
.level.locked::after{
  content:"\F47A";
  font-family:"bootstrap-icons";
  font-size:26px;
  opacity:.7;
}

/* SKELETON */
.skeleton{
  height:100px;
  border-radius:22px;
  background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
  background-size:200%;
  animation:shimmer 1.2s infinite;
}
@keyframes shimmer{to{background-position:-200%}}

/* GAME */
.game{
  background:#ffffffee;
  backdrop-filter:blur(8px);
  border-radius:22px;
  padding:16px;
  box-shadow:0 15px 30px rgba(0,0,0,.15);
}

/* COINS (flex grow/shrink) */
.coin-row{
  display:flex;
  gap:10px;
}
.coin{
  flex:1 1 0;
  background:linear-gradient(135deg,#e3f2fd,#bbdefb);
  border-radius:18px;
  padding:16px;
  text-align:center;
  font-weight:700;
  transition:.15s;
}
.coin:active{transform:scale(.92);}

/* POPUP */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.popup{
  background:#fff;
  width:90%;
  max-width:320px;
  padding:22px;
  border-radius:22px;
  box-shadow:0 20px 45px rgba(0,0,0,.35);
  animation:pop .25s ease;
}
@keyframes pop{
  from{transform:scale(.85);opacity:0}
  to{transform:scale(1);opacity:1}
}
.popup img{
  width:120px;
  margin-bottom:12px;
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const { createApp } = Vue;

const sounds={
  click:new Howl({src:["https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"]}),
  success:new Howl({src:["https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"]}),
  fail:new Howl({src:["https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"]})
};

createApp({
  data(){
    return{
      levels:[],
      screen:"home",
      current:null,
      popup:null,
      progress:JSON.parse(localStorage.getItem("progress")||"{}")
    }
  },
  mounted(){
    fetch("math.json?v="+Date.now())
      .then(r=>r.json())
      .then(d=>this.levels=d.levels);
  },
  methods:{
    isUnlocked(l,i){
      return i===0 || this.progress[this.levels[i-1].id];
    },
    startLevel(l,i){
      if(!this.isUnlocked(l,i)) return;
      sounds.click.play();
      this.current={...l,amount:0,movesLeft:l.moves};
      this.popup=null;
      this.screen="game";
    },
    tapCoin(v){
      if(this.popup||this.current.movesLeft<=0) return;
      sounds.click.play();
      this.current.amount+=v;
      this.current.movesLeft--;
      if(this.current.amount===this.current.target){
        sounds.success.play();
        const stars=this.current.movesLeft>=2?3:this.current.movesLeft===1?2:1;
        this.progress[this.current.id]=Math.max(this.progress[this.current.id]||0,stars);
        localStorage.setItem("progress",JSON.stringify(this.progress));
        this.popup={type:"success",stars};
      }else if(this.current.movesLeft===0){
        sounds.fail.play();
        this.popup={type:"fail"};
      }
    },
    retry(){
      sounds.click.play();
      this.startLevel(this.current,this.levels.findIndex(l=>l.id===this.current.id));
    },
    nextLevel(){
      sounds.click.play();
      const i=this.levels.findIndex(l=>l.id===this.current.id);
      const n=this.levels[i+1];
      this.popup=null;
      n?this.startLevel(n,i+1):this.screen="home";
    }
  },
  computed:{
    progressPercent(){
      return ((this.current.moves-this.current.movesLeft)/this.current.moves)*100;
    }
  },
  template:`
<main class="app">

<section v-if="screen==='home'">
  <h4 class="text-center mb-3">🪙 Coin Logic</h4>
  <div class="level-grid">
    <div v-if="!levels.length" v-for="i in 6" :key="i" class="skeleton"></div>
    <div v-for="(l,i) in levels" :key="l.id"
      class="level" :class="{locked:!isUnlocked(l,i)}"
      @click="startLevel(l,i)">
      <strong>Level {{l.id}}</strong>
      <small>{{'⭐'.repeat(progress[l.id]||0)}}</small>
    </div>
  </div>
</section>

<section v-else class="game">
  <div class="d-flex justify-content-between fw-bold">
    <span>Level {{current.id}}</span>
    <span>Moves {{current.movesLeft}}</span>
  </div>

  <small class="text-muted">Target ₹{{current.target}}</small>

  <div class="progress my-2">
    <div class="progress-bar bg-warning"
      :style="{width:(100-progressPercent)+'%'}"></div>
  </div>

  <h2 class="text-center my-3">₹{{current.amount}}</h2>

  <div class="coin-row mb-3">
    <div class="coin" v-for="(c,i) in current.coins" :key="i"
      @click="tapCoin(c)">+{{c}}</div>
  </div>

  <button class="btn btn-outline-secondary w-100"
    @click="screen='home'">Exit</button>
</section>

<div v-if="popup" class="overlay">
  <div class="popup text-center">
    <template v-if="popup.type==='success'">
      <img src="https://cdn-icons-png.flaticon.com/512/3159/3159066.png">
      <h5>Level Complete 🎉</h5>
      <p>{{popup.stars}} ⭐ Earned</p>
      <button class="btn btn-success w-100 mb-2" @click="nextLevel">Next</button>
    </template>

    <template v-else>
      <img src="https://cdn-icons-png.flaticon.com/512/6134/6134065.png">
      <h5>Failed 😢</h5>
      <button class="btn btn-warning w-100 mb-2" @click="retry">Try Again</button>
    </template>

    <button class="btn btn-outline-secondary w-100"
      @click="popup=null;screen='home'">Home</button>
  </div>
</div>

</main>`
}).mount("#app");
</script>
</body>
</html>
