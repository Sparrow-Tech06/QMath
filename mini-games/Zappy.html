<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Logic - Clean UI</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            background: #fff;
            color: #000;
        }

        #app { width: 100%; max-width: 400px; padding: 20px; text-align: center; }

        /* Top Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .info-box {
            border: 1.5px solid #000;
            border-radius: 8px;
            padding: 8px 25px;
            font-weight: bold;
            background: #f0f0f0;
        }

        /* Main Game Card */
        .main-card {
            background: #e0e0e0;
            border: 1.5px solid #000;
            border-radius: 20px;
            padding: 40px 20px;
            position: relative;
            margin-bottom: 40px;
        }

        .target-label {
            background: #d0d0d0;
            border: 1.5px solid #000;
            border-radius: 12px;
            padding: 15px;
            display: inline-block;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 30px;
            min-width: 150px;
        }

        .yellow-line {
            height: 6px;
            background: #ffd700;
            width: 100%;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .amount-display {
            font-size: 3rem;
            font-weight: bold;
            border-bottom: 3px solid #000;
            display: inline-block;
            min-width: 120px;
            padding-bottom: 5px;
        }

        /* Option Buttons Grid with MinMax */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            margin-bottom: 50px;
            justify-items: center;
        }

        .option-btn {
            background: #e0e0e0;
            border: 1.5px solid #000;
            border-radius: 15px;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .option-btn:active { transform: scale(0.9); }

        /* Reset Button */
        .reset-btn {
            background: #ffd700;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            border: none;
            cursor: pointer;
            font-size: 2.5rem;
        }

        /* Popup Styles */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .popup {
            background: white;
            border: 2px solid #000;
            padding: 30px;
            border-radius: 20px;
            width: 80%;
            max-width: 300px;
        }

        .level-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .lvl-box {
            border: 1px solid #000;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .lvl-box.locked { opacity: 0.5; background: #eee; }
    </style>
</head>
<body>

<div id="app">
    <div v-if="screen==='home'">
        <h3 class="mb-4">Select Level</h3>
        <div class="level-list">
            <div v-for="(l, i) in levels" :key="l.id" 
                 class="lvl-box" :class="{locked: !isUnlocked(l,i)}"
                 @click="startLevel(l,i)">
                {{l.id}}
            </div>
        </div>
    </div>

    <div v-if="screen==='game'">
        <div class="game-header">
            <div class="info-box" @click="screen='home'">Level {{current.id}}</div>
            <div class="info-box">Moves {{current.movesLeft}}</div>
        </div>

        <div class="main-card">
            <div class="target-label">Target {{current.target}}</div>
            <div class="yellow-line"></div>
            <div class="amount-display">{{current.amount}}</div>
        </div>

        <div class="btn-grid">
            <div v-for="c in current.coins" :key="c" 
                 class="option-btn" @click="tapCoin(c)">
                +{{c}}
            </div>
        </div>

        <button class="reset-btn" @click="retry">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </div>

    <div v-if="popup" class="overlay">
        <div class="popup">
            <h2 v-if="popup.type==='success'">Level Clear!</h2>
            <h2 v-else>Failed!</h2>
            <button class="info-box w-100 mt-3" @click="popup.type==='success' ? nextLevel() : retry()">
                {{popup.type==='success' ? 'Next' : 'Retry'}}
            </button>
        </div>
    </div>
</div>

<script>
const { createApp } = Vue;

const sounds = {
    success: new Howl({ src: ["https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"] }),
    fail: new Howl({ src: ["https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"] })
};

createApp({
    data() {
        return {
            levels: [],
            screen: "home",
            current: null,
            popup: null,
            progress: JSON.parse(localStorage.getItem("coin_prog") || "{}")
        }
    },
    mounted() {
        fetch("math.json?v="+Date.now())
            .then(r => r.json())
            .then(d => this.levels = d.levels);
    },
    methods: {
        isUnlocked(l, i) {
            return i === 0 || this.progress[this.levels[i - 1].id];
        },
        startLevel(l, i) {
            if (!this.isUnlocked(l, i)) return;
            this.current = { ...l, amount: 0, movesLeft: l.moves };
            this.popup = null;
            this.screen = "game";
        },
        tapCoin(v) {
            if (this.popup || this.current.movesLeft <= 0) return;
            this.current.amount += v;
            this.current.movesLeft--;

            if (this.current.amount === this.current.target) {
                sounds.success.play();
                this.progress[this.current.id] = true;
                localStorage.setItem("coin_prog", JSON.stringify(this.progress));
                this.popup = { type: "success" };
            } else if (this.current.movesLeft === 0 || this.current.amount > this.current.target) {
                sounds.fail.play();
                this.popup = { type: "fail" };
            }
        },
        retry() {
            const idx = this.levels.findIndex(l => l.id === this.current.id);
            this.startLevel(this.levels[idx], idx);
        },
        nextLevel() {
            const i = this.levels.findIndex(l => l.id === this.current.id);
            const n = this.levels[i + 1];
            n ? this.startLevel(n, i + 1) : this.screen = "home";
            this.popup = null;
        }
    }
}).mount("#app");
</script>
</body>
</html>
