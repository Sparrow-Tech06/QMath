<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Qmath-miniGames </title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="../css/arcade.css">
<link rel="stylesheet" href="../global.css">
<script src="../control_center/version-check.js" defer> </script>
  
<style>
:root{
  --bg:#ffffff;
  --text:#111;
  --muted:#666;
  --border:#e5e7eb;
  --primary:#6c2bd9;
}

/* Base */
body{
  background:var(--bg);
  font-family: system-ui, -apple-system, sans-serif;
  margin:0;
  color:var(--text);
}

.app{
  min-height:100vh;
  padding-top:10px;
}

/* Section Title */
.section-title{
  font-size:18px;
  font-weight:600;
  margin:15px;
}

/* Horizontal Scroll */
.scroll-x{
  display:flex;
  overflow-x:auto;
  gap:12px;
  padding:0 15px 10px;
}

.scroll-x::-webkit-scrollbar{
  display:none;
}

/* Game Card */
.game-link{
  text-decoration:none;
  color:inherit;
}

.game-card{
  min-width:160px;
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--border);
  background:#fff;
}

.game-card img{
  width:100%;
  height:110px;
  object-fit:cover;
}

.game-card h6{
  text-align:center; /* center name */
  padding:8px;
  margin:0;
  font-size:14px;
}

/* Task list */
.task-link{
  text-decoration:none;
  color:inherit;
}

.task-box{
  margin:10px 15px;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.task-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-box{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Button fixed width */
.btn-main{
  width:90px;
  border-radius:20px;
  background:var(--primary);
  color:#fff;
  border:none;
}

</style>
</head>

<body>

  <header class="sticky-header" role="banner">
      <button class="back-btn" role="button" aria-label="Go back" onclick="window.history.back();">
          <i class="bi bi-arrow-left"></i>
     </button>
    <h3 id="header-heading" aria-live="polite"> Qmath </h3>
  </header>

<div class="app">

<!-- Games -->
<div class="section-title">Games</div>
<div class="scroll-x" id="games"></div>


<!-- ADD THIS WHERE YOU WANT BUTTON -->

<div style="padding:20px;">
  <button id="rewardBtn" class="btn btn-dark w-100">
    Get 50 Points (Ad 0/10)
  </button>
</div>
  

<!-- Tasks -->
<div class="section-title">Tasks</div>
<div id="tasks"></div>

</div>


<script src="rewardController.js"></script>
<script>
  initRewardButton("rewardBtn");
</script>

<script>

/* ========= DATA ========= */

const data = {

  games:[
    {name:"ZAPPY", img:"https://picsum.photos/300/200?1", link:"Zappy.html"},
    {name:"BGMI", img:"https://picsum.photos/300/200?2", link:"#"}
  ],

  tasks:[
    {name:"Daily Bonus", icon:"bi-gift", btn:"Get", link:"#"},
    {name:"Watch Video", icon:"bi-play-circle", btn:"Watch", link:"#"},
    {name:"Invite Friends", icon:"bi-share", btn:"Invite", link:"#"}
  ]
};

/* ========= RENDER ========= */

// Games
const gamesEl = document.getElementById("games");

data.games.forEach(g=>{
  gamesEl.innerHTML += `
    <a href="${g.link}" class="game-link">
      <div class="game-card">
        <img src="${g.img}">
        <h6>${g.name}</h6>
      </div>
    </a>
  `;
});

// Tasks
const taskEl = document.getElementById("tasks");

data.tasks.forEach(t=>{
  taskEl.innerHTML += `
    <a href="${t.link}" class="task-link">
      <div class="task-box">
        <div class="task-left">
          <div class="icon-box">
            <i class="bi ${t.icon}"></i>
          </div>
          <div>${t.name}</div>
        </div>
        <button class="btn btn-main">${t.btn}</button>
      </div>
    </a>
  `;
});

</script>

</body>
</html>
