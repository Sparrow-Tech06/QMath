<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no,viewport-fit=cover">         
    <title> SkyDrop - Free Fire Quiz </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <link href="../css/settings.css" rel="stylesheet">
    <link href="../global.css" rel="stylesheet">
    
    <script src="../control_center/version-check.js"> </script>
    
</head>

<body>

    <header class="topbar" id="topbar">
        <button class="back-btn" onclick="history.back()">
           <i class="bi bi-arrow-left"></i>
       </button>
        <img src="../assets/splash.png" id="topImg">
        <span class="topbar-name" id="topName"> Qmath: Daily Math Practice </span>
    </header>

<div class="app-container">

    <section class="profile" id="profileHeader">
        <img src="../assets/splash.png" class="profile-img" id="profileImg" loading="lazy" draggable="false">        
        <div>
            <div class="profile-name"> Qmath: Daily Math Practice </div>
            <div class="profile-version"> Version 2.2 </div>
        </div>
    </section>

    <main class="mb-5">
        <nav class="menu-card">
            <ul id="menuList"></ul>
        </nav>
    </main>

</div>

<script>
/* Updated menu data with specific links */
const menuData = [
    { title: "My Activity History", icon: "clock-history", link: "../coin/my-coin.html", type: "link" },
    { title: "My Rewards", icon: "trophy", link: "../coin/prize.html", type: "link" },
    { title: "Rate Our App", icon: "star-fill", link: "https://play.google.com/store/apps/details?id=com.kyra.qmath" },
    { title: "Privacy Policy", icon: "lock", link: "../pages/privacy-policy.html", type: "link" },
    { title: "Contact Us", icon: "envelope-at", link: "mailto:team.kyraapps@outlook.com?subject=App Support Request", type: "mailto" }
];

const menuList = document.getElementById("menuList");

menuData.forEach((item, i) => {
    const li = document.createElement("li");

    // Yahan href="${item.link}" add kiya gaya hai
    li.innerHTML = `
    <a href="${item.link}" class="menu-item">
        <div class="menu-left">
            <div class="icon-circle">
                <i class="bi bi-${item.icon}"></i>
            </div>
            <span>${item.title}</span>
        </div>
        <i class="bi bi-chevron-right arrow"></i>
    </a>
    `;

    menuList.appendChild(li);

    if (i < menuData.length - 1) {
        const divider = document.createElement("div");
        divider.className = "menu-divider";
        menuList.appendChild(divider);
    }
});

/* Premium scroll animation logic */
const profileHeader = document.getElementById("profileHeader");
const profileImg = document.getElementById("profileImg");
const topbar = document.getElementById("topbar");

window.addEventListener("scroll", () => {
    const rect = profileHeader.getBoundingClientRect();
    let progress = Math.min(Math.max(-rect.top / 120, 0), 1);

    /* profile image shrink */
    profileImg.style.transform = `scale(${1 - progress * 0.2})`;

    /* sticky header show/hide */
    if (progress > 0.20) {
        topbar.classList.add("show", "active");
    } else {
        topbar.classList.remove("show", "active");
    }
});
</script>

</body>
</html>
