<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprint Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../butterfly.css">
</head>

<body>

<div class="game">

  <div class="top">
    <span id="timerBox">Waiting...</span>
    <span id="progress">Played: 0 / 20</span>
  </div>

  <div class="card">
    <div id="question"></div>
    <div id="options"></div>

    <button id="submitBtn"
      onclick="endGame()"
      style="display:none">
      Submit & Finish
    </button>
  </div>

</div>

<script src="../menu.js"></script>

<script>

/* ================= HARD LOCK ================= */
let gameLocked = true;

/* ================= STATE ================= */
let timerOn=false;
let time=30;
let score=0;
let index=0;
const total=20;
let timerRef=null;

const timerBox=document.getElementById("timerBox");
const progress=document.getElementById("progress");
const question=document.getElementById("question");
const options=document.getElementById("options");
const submitBtn=document.getElementById("submitBtn");

/* ================= START GAME ================= */
function startGame(){

  if(!gameLocked) return;
  gameLocked=false;

  timerOn = localStorage.getItem("timerOn")==="1";

  if(timerOn){
    timerBox.innerText=`⏱ ${time}s`;

    timerRef=setInterval(()=>{
      time--;
      timerBox.innerText=`⏱ ${time}s`;

      if(time<=0) endGame();
    },1000);

  }else{
    timerBox.innerText="No Timer";
    submitBtn.style.display="block";
  }

  nextQuestion();
}

/* ================= QUESTIONS ================= */
function nextQuestion(){

  if(gameLocked) return;
  if(index===total){ endGame(); return; }

  index++;
  progress.innerText=`Played: ${index} / ${total}`;

  const a=Math.floor(Math.random()*10);
  const b=Math.floor(Math.random()*10);
  const ans=a+b;

  question.innerText=`${a} + ${b} = ?`;
  options.innerHTML="";

  for(let i=0;i<4;i++){

    const val=i===0?ans:ans+Math.floor(Math.random()*5)+1;

    const div=document.createElement("button");
    div.className="btn btn-light m-1";
    div.innerText=val;

    div.onclick=()=>{
      if(val===ans) score++;
      setTimeout(nextQuestion,500);
    };

    options.appendChild(div);
  }
}

/* ================= END ================= */
function endGame(){

  clearInterval(timerRef);

  localStorage.setItem("lastScore",score);
  localStorage.setItem("lastTotal",total);

  location.replace("../result.html");
}

/* ================= WAIT MENU ================= */
document.addEventListener("game:start", startGame);

</script>

</body>
</html>
