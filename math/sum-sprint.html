<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprint Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>

<link rel="stylesheet" href="../butterfly.css">
</head>

<body>

<div class="game">

  <div class="top">
    <span id="timerBox">Waiting...</span>
    <span class="progress-text" id="progress">Played: 0 / 20</span>
  </div>

  <div class="card">
    <div class="q" id="question"></div>
    <div id="options" class="options-grid"></div>

    <button id="submitBtn"
      class="btn btn-outline-primary w-100 submit"
      onclick="endGame(true)"
      style="display:none">
      Submit & Finish
    </button>
  </div>

</div>

<script src="../menu.js"></script>
<script src="../answer-feedback.js"></script>

<script>
/* ================= STATE ================= */
let timerOn = false;
let soundOn = false;

let time = 30;
let score = 0;
let index = 0;
const total = 20;
let timerRef = null;
let gameEnded = false;

/* ================= ELEMENTS ================= */
const timerBox = document.getElementById('timerBox');
const progress = document.getElementById('progress');
const submitBtn = document.getElementById('submitBtn');
const question = document.getElementById('question');
const options = document.getElementById('options');

/* ================= SOUNDS ================= */
const click   = new Howl({ src:['../assets/sound/click.mp3'], volume:.5 });
const correct = new Howl({ src:['../assets/sound/correct.mp3'], volume:.6 });
const wrong   = new Howl({ src:['../assets/sound/wrong.mp3'], volume:.6 });

/* =====================================================
   GAME START (CALLED AFTER MENU START CLICK)
===================================================== */
function startGame(){

  timerOn = localStorage.getItem('timerOn') === '1';
  soundOn = localStorage.getItem('soundOn') === '1';

  if(timerOn){
    timerBox.innerText = `⏱ ${time}s`;

    timerRef = setInterval(()=>{
      time--;
      timerBox.innerText = `⏱ ${time}s`;

      if(time <= 0) endGame(false);
    },1000);

  }else{
    timerBox.innerText = "No Timer";
    submitBtn.style.display = "block";
  }

  nextQuestion();
}

/* ================= QUESTIONS ================= */
function nextQuestion(){

  if(gameEnded) return;
  if(index === total){ endGame(false); return; }

  index++;
  progress.innerText = `Played: ${index} / ${total}`;

  const a = Math.floor(Math.random()*10);
  const b = Math.floor(Math.random()*10);
  const answer = a + b;

  question.innerText = `${a} + ${b} = ?`;
  options.innerHTML = "";

  const correctPos = Math.floor(Math.random()*4);

  for(let i=0;i<4;i++){

    const val = i===correctPos
      ? answer
      : answer + Math.floor(Math.random()*5)+1;

    const div = document.createElement("div");
    div.className = "opt";
    div.innerText = val;

    div.onclick = ()=>{

      if(gameEnded || div.classList.contains("opt-disabled")) return;

      options.querySelectorAll('.opt')
        .forEach(o=>o.classList.add('opt-disabled'));

      if(soundOn) click.play();

      if(val===answer){
        score++;
        if(soundOn) correct.play();
      }else{
        if(soundOn) wrong.play();
      }

      setTimeout(nextQuestion,600);
    };

    options.appendChild(div);
  }
}

/* ================= END GAME ================= */
function endGame(){

  if(gameEnded) return;
  gameEnded = true;

  clearInterval(timerRef);

  let allowReward = timerOn || index===total;

  if(allowReward){
    localStorage.setItem('rewardKey',Date.now());
  }

  localStorage.setItem('lastGame','Sprint Quiz');
  localStorage.setItem('lastScore',score);
  localStorage.setItem('lastTotal',total);
  localStorage.setItem('currentGame','sprint');

  location.replace('../result.html');
}

/* ✅ WAIT FOR MENU */
document.addEventListener("game:start", startGame);

</script>

</body>
</html>
