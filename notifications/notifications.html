<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> QMath - Notifications </title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="control_center/version-check.js" defer></script>
<link rel="stylesheet" href="../global.css">

<style>

/* ================= ROOT ================= */
:root {
  --muted: #6c757d;
  --card: #ffffff;
  --popup: #ffffff;
  --popup-text: #000;

  --border: #e9ecef;
  --text: #212529;
  --header: #f8f9fa;
}

/* DARK MODE */
@media (prefers-color-scheme: dark) {
  :root {
    --muted: #9aa0a6;
    --card: #1e2125;
    --popup: #1e2125;
    --popup-text: #f1f3f5;

    --border: #2f3338;
    --text: #e9ecef;
    --header: #121417;
  }
}

/* ================= BASE ================= */
body {
  font-family: 'Inter', sans-serif;
  background: var(--header);
  color: var(--text);
}

/* ================= HEADER ================= */
.header-section {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}

.back-btn {
  border: none;
  background: transparent;
  font-size: 20px;
}

.title {
  font-weight: 600;
  font-size: 16px;
}

/* ================= DATE ================= */
.date-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin: 18px 4px 8px;
}

/* ================= CARD ================= */
.notification-card {
  border-radius: 16px;
  background: var(--card);
  padding: 12px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid var(--border);
}

.notification-card:active {
  transform: scale(0.96);
}

.notification-card:hover {
  box-shadow: 0 6px 14px rgba(0,0,0,0.08);
}

/* LOGO */
.notification-logo {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  object-fit: cover;
}

/* TEXT */
.not-title {
  font-weight: 600;
  font-size: 15px;
  line-height: 1.3;
}

.not-time {
  font-size: 11.5px;
  color: var(--muted);
}

/* ================= NO DATA ================= */
.no-data {
  text-align: center;
  margin-top: 120px;
}

.no-data i {
  font-size: 60px;
  color: var(--muted);
}

/* ================= POPUP ================= */
.popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.popup-content {
  background: var(--popup);
  padding: 22px;
  border-radius: 18px;
  width: 90%;
  max-width: 360px;
  text-align: center;

  transform: translateY(40px) scale(0.9);
  opacity: 0;
  transition: 0.3s ease;
}

.popup.show .popup-content {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.popup h5 {
  font-size: 16px;
  font-weight: 600;
  color: var(--popup-text);
}

.popup p {
  font-size: 14px;
  color: var(--popup-text);
  margin-top: 6px;
}

.popup button {
  border-radius: 10px;
  font-size: 13px;
}

</style>
</head>

<body>

<!-- HEADER -->
<header class="header-section">
  <button class="back-btn" onclick="window.history.back();">
    <i class="bi bi-arrow-left"></i>
  </button>
  <div class="title">Notification</div>
  <div></div>
</header>

<!-- MAIN -->
<main class="container py-3">
  <section id="notificationsContainer"></section>
</main>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content shadow">
    <h5 id="popupTitle"></h5>
    <p id="popupContent"></p>
    <button class="btn btn-primary btn-sm mt-2" onclick="closePopup()">Close</button>
  </div>
</div>

<!-- JS -->
<script>

let lastData = "";

/* Fetch Notifications */
async function fetchNotifications() {
  try {
    const res = await fetch("notifications.json");
    const data = await res.json();

    const newData = JSON.stringify(data);
    if (newData === lastData) return;
    lastData = newData;

    const container = document.getElementById("notificationsContainer");
    container.innerHTML = "";

    if (Object.keys(data).length === 0) {
      container.innerHTML = `
        <div class="no-data">
          <i class="bi bi-bell-slash"></i>
          <h5>No Notifications</h5>
          <p>Nothing to show right now</p>
        </div>`;
      return;
    }

    for (const date in data) {
      const dateDiv = document.createElement("div");
      dateDiv.className = "date-title";
      dateDiv.textContent = date;
      container.appendChild(dateDiv);

      data[date].forEach(noti => {
        const card = document.createElement("article");
        card.className = "notification-card";

        card.innerHTML = `
          <div class="d-flex align-items-center">
            <img src="../assets/splash.png" class="notification-logo me-3">
            <div>
              <div class="not-title">${noti.title}</div>
              <div class="not-time">${noti.time}</div>
            </div>
          </div>
        `;

        card.onclick = () => showPopup(noti.title, noti.content);
        container.appendChild(card);
      });
    }

  } catch (err) {
    console.error(err);
  }
}

/* Popup */
function showPopup(title, content) {
  const popup = document.getElementById("popup");

  document.getElementById("popupTitle").innerText = title;
  document.getElementById("popupContent").innerText = content;

  popup.style.display = "flex";
  setTimeout(() => popup.classList.add("show"), 10);
}

function closePopup() {
  const popup = document.getElementById("popup");
  popup.classList.remove("show");

  setTimeout(() => popup.style.display = "none", 300);
}

/* Interval same (no logic change) */
setInterval(fetchNotifications, 5000);
fetchNotifications();

</script>

</body>
</html>
